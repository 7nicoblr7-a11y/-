<style>
:root{--bg:#faf8f4;--fg:#1f1c18;--mu:#6e675d;--cd:#fff;--bd:#e3ddd0;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16130f;--fg:#efe9dd;--mu:#a49c8e;--cd:#201c17;--bd:#383128;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16130f;--fg:#efe9dd;--mu:#a49c8e;--cd:#201c17;--bd:#383128;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
#app{position:relative;display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;background:var(--bg)}
#top{flex:none;display:flex;gap:10px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 6px}#top b{font-size:1.25rem;white-space:nowrap}
#q{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--cd);color:var(--fg)}
#gp{flex:none;margin-left:auto;font-size:.78rem;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--fg);color:var(--bg)}
#sr{position:absolute;z-index:40;left:8px;right:8px;top:calc(56px + env(safe-area-inset-top,0px));max-height:62dvh;overflow:auto;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:6px 12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}#sr:empty{display:none}
#v1{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#bar,#dp{flex:none;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:4px 12px;white-space:nowrap;scrollbar-width:none}
#mw{flex:1;min-height:0;touch-action:none;overflow:hidden}
svg{width:100%;height:100%;display:block}svg text{font-family:inherit;pointer-events:none}svg g{cursor:pointer}
.pn{flex:1;min-height:0;overflow:auto;padding:6px 14px 16px}
.hide{display:none!important}
.so #dp{display:none}
.tabs{flex:none;display:flex;gap:2px;background:var(--cd);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;font:inherit;font-size:.82rem;border:0;border-radius:10px;padding:11px 2px;background:none;color:var(--fg);cursor:pointer}.tabs button.on{background:var(--fg);color:var(--bg)}
.ch,.sb{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--fg);border-radius:999px;padding:6px 11px;font-size:.88rem;cursor:pointer;flex:none}
.ch{display:inline-block;margin:3px 4px 3px 0}.ch b{margin-right:4px}.ch.on,.rw button.on{background:var(--bd)}.sb{margin:3px 4px 3px 0}
#bar .ch small{color:var(--mu);margin-left:3px;font-size:.78rem}
.mp{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:-2px}
.x{float:right}
.sub{color:var(--mu);font-size:.85rem;margin:0 0 8px;white-space:normal}
.k{font-size:.72rem;letter-spacing:.06em;color:var(--mu);margin:12px 0 2px;font-weight:600}
.row{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:none;border:0;border-top:1px solid var(--bd);padding:12px 2px;cursor:pointer}.row span{color:var(--mu);display:block;font-size:.9rem}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--bd);padding:6px 0;font-size:.9rem}.rw button{border:1px solid var(--bd);background:none;border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--fg)}
.rw small,.row small{display:block;color:var(--mu)}.e{color:var(--mu);font-size:.85rem}
details{margin:10px 0;border:1px solid var(--bd);border-radius:10px;padding:6px 10px}summary{cursor:pointer;font-weight:600}
.ft{color:var(--mu);font-size:.82rem}#wp img{display:block;margin:8px 0}

/* ===== Curseur de progression (côté droit de la carte) ===== */
#sl{position:absolute;z-index:30;right:6px;top:52px;bottom:10px;width:50px;display:flex;flex-direction:column;align-items:center;gap:8px;--ac:#888;--ac2:#bbb}
#sl.hide{display:none!important}
#slv{flex:none;min-width:48px;text-align:center;font-size:.82rem;font-weight:800;color:#fff;background:var(--ac);border-radius:999px;padding:4px 8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#slw{position:relative;flex:1;min-height:60px;width:38px;touch-action:none;cursor:grab}
#slw::before{content:"";position:absolute;inset:0 -8px}
#slt{position:absolute;inset:0 6px;border-radius:99px;overflow:hidden;background:var(--cd);border:1px solid var(--bd);box-shadow:inset 0 2px 8px rgba(0,0,0,.22)}
#slt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),rgba(128,128,128,.4) calc(25% - 1px),rgba(128,128,128,.4) 25%)}
#slf{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--ac),var(--ac2))}
#slh{position:absolute;left:-2px;right:-2px;height:26px;border-radius:13px;background:#fff;border:3px solid var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.4);bottom:0}
#slh::after{content:"";position:absolute;left:11px;right:11px;top:9px;height:6px;border-top:2px solid #bbb;border-bottom:2px solid #bbb}

/* ===== Fiche d'une loi ===== */
#card{display:none}
#card.open{display:block;flex:none;max-height:54dvh;overflow:auto;background:var(--cd);border-top:1px solid var(--bd);border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.25);animation:up .28s ease}
@keyframes up{from{transform:translateY(26px);opacity:0}}
.hd{position:relative;overflow:hidden;color:#fff;padding:16px 16px 14px}
.hd .bg,.dl2 .bg{position:absolute;right:-6px;bottom:-26px;font-size:6.5rem;font-weight:900;opacity:.16;line-height:1;pointer-events:none}
.hd .dmn{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hd h2{margin:3px 38px 4px 0;font-size:1.5rem;line-height:1.15}
.hd .pr{margin:0 0 10px;font-size:.95rem;opacity:.95;font-style:italic}
.cx{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;font-size:1rem;cursor:pointer}
.lv{display:flex;align-items:center;gap:10px}.lv .tr{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}.lv .tr i{display:block;height:100%;background:#fff;border-radius:99px}
.lb{font-size:.78rem;opacity:.9;margin-top:4px}
.bd{padding:6px 14px 18px}
.cd{border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.cd p{margin:2px 0}
.ct{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin-bottom:2px}
.act{border-width:2px}.act p{font-size:1.02rem;font-weight:600}
.big{font:inherit;font-weight:800;border:2px solid var(--ac);background:none;color:var(--ac);border-radius:999px;padding:9px 18px;margin-top:8px;cursor:pointer}.big.on{background:var(--ac);color:#fff}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}.two .cd{margin:0}
.er{background:#d6453d16;border-color:#d6453d55}.er .ct{color:#d6453d}
.fx{background:#2f9f5f16;border-color:#2f9f5f55}.fx .ct{color:#2f9f5f}
.ig{background:#6e675d12}
.cd.chain{padding:6px 12px}
.tl{margin:10px 0}.tl.up{--tc:#2f9f5f}.tl.dn{--tc:#d6453d}.tl .tt{font-weight:800;margin:4px 0 8px;color:var(--tc)}
.st{display:flex;gap:10px;align-items:flex-start;position:relative;padding-bottom:10px;font-size:.92rem}
.st:not(:last-of-type)::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--tc);opacity:.4}
.dot{flex:none;width:24px;height:24px;border-radius:50%;background:var(--tc);color:#fff;font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.dl{display:inline-block;margin:0 0 4px 34px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--tc);color:var(--tc)}
.lk{margin-top:14px}

/* ===== Aujourd'hui ===== */
.hero{display:flex;gap:14px;align-items:center;background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:14px;margin:4px 0 10px}
.rg{position:relative;width:104px;height:104px;flex:none}.rg svg{width:100%;height:100%;display:block}
.rg b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.45rem}
.rg .pr2{transition:stroke-dasharray .6s}
.hi{margin:0;font-size:1.25rem;font-weight:800}.hs{margin:2px 0 8px;color:var(--mu);font-size:.85rem}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--bd);margin:2px 4px 2px 0}
.dl2{position:relative;overflow:hidden;color:#fff;border-radius:20px;padding:16px;margin:10px 0}
.dl2 .k2{font-size:.68rem;font-weight:800;letter-spacing:.1em;opacity:.85}
.dl2 h3{margin:3px 0 4px;font-size:1.3rem;line-height:1.15}.dl2 p{margin:0;font-style:italic;opacity:.95}
.act2{background:rgba(0,0,0,.24);border-radius:12px;padding:9px 12px;margin:10px 0}
.wb{font:inherit;font-weight:800;border:0;border-radius:999px;padding:9px 15px;background:#fff;color:#222;margin:2px 6px 0 0;cursor:pointer}
.cd2{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;margin:10px 0}.cd2 .k{margin-top:0}
.wk{display:flex;justify-content:space-between;gap:6px}
.wd{flex:1;text-align:center;font-size:.75rem;color:var(--mu)}
.wd i{display:block;margin:4px auto 0;width:32px;height:32px;border-radius:50%;border:2px solid var(--bd);font-style:normal;line-height:28px;font-weight:800;color:#fff}
.wd.ok i{background:#2f9f5f;border-color:#2f9f5f}.wd.tdy i{border-color:var(--fg)}.wd.tdy{color:var(--fg);font-weight:800}
.pb{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin:6px 0 8px}.pb i{display:block;height:100%;background:#2f9f5f;border-radius:99px;transition:width .4s}
.rt{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}.rt small{display:block;color:var(--mu)}
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ac);background:none;color:#fff;font-weight:800;cursor:pointer}
.rt.ok .ck{background:var(--ac)}.rt.ok span{opacity:.55}
.fb{flex:none;margin-left:auto;border:1px solid var(--bd);background:none;border-radius:8px;padding:5px 9px;cursor:pointer;color:var(--fg);font:inherit;font-size:.85rem}
.rt span{flex:1;min-width:0}
.db{display:grid;grid-template-columns:1.1fr 1.6fr 42px;gap:8px;align-items:center;width:100%;font:inherit;font-size:.85rem;color:var(--fg);background:none;border:0;padding:5px 0;text-align:left;cursor:pointer}.db .pb{margin:0}.db b{text-align:right}
@media print{html,body{overflow:visible;height:auto}#app{display:block;height:auto;max-width:none}body *{visibility:hidden}#sv,#sv *{visibility:visible}#v5{display:block!important;position:absolute;left:0;top:0;width:100%}#sv button,#wp{display:none}}
.ou{margin:7px 0 0!important;font-size:.93rem}
.bib{border-width:2px}.bib summary{font-weight:800;padding:4px 0}.vs{border-left:4px solid;padding:2px 0 2px 10px;margin:12px 0}.vs p{margin:0 0 3px;font-style:italic}.vs b{font-size:.82rem}.src{font-size:.72rem;color:var(--mu);margin:4px 0 0}

["1.3","Première Part","Vire une part automatique (don/épargne) dès la paie, avant toute dépense.","Manque permanent, aucune réserve."],
["1.4","Calcul préalable","Liste toutes les dépenses d’un projet avant de t’engager.","Projet abandonné à mi-chemin, ressources perdues."],
["1.5","Talents & fidélité","Range et organise ton espace de travail : sois fiable dans le petit.","Capital enterré = confisqué, confiance perdue."],
["1.6","Dette","Liste toutes tes dettes avec leurs taux d’intérêt.","Le prêteur te dirige ; risque d’insolvabilité."],
["2.1","Sabbat","Téléphone pro éteint dès 19h ; un vrai jour sans travail par semaine.","Effondrement physique ou mental forcé."],
["2.2","Corps & mouvement","30 min de marche active d’un seul tenant.","Fragilité physique, dépendance précoce."],
["2.3","Sobriété","−20 % au dîner, zéro produit raffiné.","Maladies chroniques, déclin précoce."],
["2.4","Sommeil","Écrans coupés 1 h avant le lit, heures régulières.","Erreurs coûteuses, usure du cœur et du métabolisme."],
["2.5","Cycles naturels","15 min de lumière dehors dès le matin.","Sommeil et métabolisme déréglés."],
["2.6","Cadre de vie","Nettoie et aère à fond la pièce où tu dors.","Esprit confus, lieu qui repousse."],
["2.7","Décharge des soucis","Souci qui tourne : ramène l’attention sur la seule tâche présente.","Épuisement, paralysie."],
["2.8","Maîtrise de soi","Supprime de tes appareils les contenus qui te piègent.","Impulsions aux commandes : dépendance, relations rompues."],
["2.9","Premier matin","Téléphone coupé (ou en avion) les 30 premières minutes.","Des années à réagir au lieu d’avancer."],
["3.1","Association","Trie ton entourage : prends de la distance avec les conversations qui tirent vers le bas.","Tu descends avec ceux que tu fréquentes."],
["3.2","Pardon","Dis à voix haute que tu pardonnes à quelqu’un, sans attendre ses excuses.","Rancune qui t’empoisonne, relations détruites."],
["3.3","Conflit : traiter vite","Contacte la personne aujourd’hui : fixe un tête-à-tête.","Plaie infectée : amertume, rupture."],
["3.4","Service","Rends un service concret à un proche sans qu’il le demande.","Seul au premier coup dur."],
["3.5","Récolte relationnelle","Complimente sincèrement 3 personnes de ton quotidien.","Rejet au moment où tu as besoin d’aide."],
["3.6","Alliance conjugale","Dis un mot d’appréciation clair à ton conjoint, sans raison.","Chaos familial durable."],
["3.7","Honneur des parents","Une phrase de reconnaissance concrète à un parent.","Isolement plus tard, schéma répété par tes enfants."],
["3.8","Transmission","Raconte à un jeune un épisode de ta vie (réussite ou échec).","Le fruit de ton travail passe à d’autres."],
["4.1","Autorités","Mets-toi en règle sur une obligation administrative ou fiscale en retard.","Sanctions, perte de liberté."],
["4.2","Humilité","Demande un avis sincère à quelqu’un que tu sous-estimes.","Chute publique."],
["4.3","Service ascendant","Fais toi-même la tâche ingrate du jour, sans le dire.","Plafond de carrière : on ne te suit plus."],
["4.4","Vision écrite","Écris en 10 lignes la direction que tu tiens.","Années dispersées, cap jamais atteint."],
["4.5","Intégrité","Corrige un détail inexact (message, document, déclaration).","Découverte, confiance perdue, effondrement."],
["4.6","Conseil multiple","Pose une vraie question (pas une demande de validation) à quelqu’un d’expérimenté.","Décider seul : la faille est déjà dedans."],
["4.7","Responsabilité","Écris en une phrase ta part dans une difficulté actuelle.","Impuissance durable, relations tendues."],
["4.8","Non-jugement","Aucun jugement catégorique sur une personne absente aujourd’hui.","Tu seras jugé aussi durement au premier faux pas."],
["4.9","Équité envers les autres","Paie sans attendre les factures dues aux prestataires et collaborateurs.","Confiance perdue, service qui s’effondre."],
["5.1","Parole créatrice","Remplace une phrase négative habituelle sur toi par sa version alignée.","Tu t’enfermes dans tes propres paroles."],
["5.2","Silence stratégique","Écris la réponse à chaud, attends 24 h avant d’envoyer.","Exclu des cercles où se décident les choses."],
["5.3","Renouvellement","20 min de lecture exigeante, écran hors de vue.","Esprit formaté par des intérêts qui ne sont pas les tiens."],
["5.4","Garde de l’attention","Mesure ton temps d’écran et coupe une source captive.","Vie réactive, trajectoire détournée."],
["5.5","Oui fiable","Fais la chose promise depuis le plus longtemps.","Crédit évaporé : on ne te recommande plus."],
["5.6","Confession alignée","Écris une phrase vraie sur ta direction, dis-la à voix haute ce matin.","Tu nourris le scénario que tu redoutes."],
["5.7","Gratitude","Note 5 sujets précis de reconnaissance des dernières 24 h.","Amertume, vide intérieur."],
["6.1","Loi-Mère : semence & moisson","Note ce que tu sèmes (temps, paroles, argent) et ajoute une graine.","Tu récoltes ce que tu sèmes, multiplié — le négatif aussi."],
["6.2","Foi agissante","Fais aujourd’hui le plus petit acte possible dans le sens de ta prière.","Une foi sans acte reste morte."],
["6.3","Prière alignée","Une demande précise, appuyée sur un verset, avec remerciement anticipé.","Tu demandes mal : pas de résultat."],
["6.4","Obéissance réflexe","Applique avant ce soir une conviction reçue.","Effondrement à la première tempête."],
["6.5","Priorité absolue","Supprime une distraction récurrente ; l’essentiel passe en premier.","Médiocrité, inquiétude permanente."],
["6.6","Persévérance","Reprends 10 min un projet abandonné depuis plus d’un an.","Tu abandonnes à quelques jours de la récolte."],
["6.7","Sacrifice","Renonce à un petit confort pour quelqu’un d’autre ou une cause.","Plafond invisible, perte de sens."],
["7.1","Sagesse","Écris une décision en attente et demande la sagesse avant de trancher.","Chemins tortueux, regrets tardifs."],
["7.2","Aveu","Nomme par écrit une faute précise, sans excuse.","Ce que tu caches t’épuise et grandit."],
["7.3","Pauvres & justice","Un geste concret (aide, repas, appel) pour quelqu’un en difficulté.","Le cœur s’endurcit."],
["7.4","Contentement","Écris 3 choses reçues aujourd’hui dont tu te passerais mal.","Course au toujours plus : dettes, surmenage."],
["7.5","Amour du prochain","Un acte d’attention pour quelqu’un qui ne s’y attend pas.","Relations froides, isolement."]];

const X={"1.1":{"p":"Le travail est la porte d’entrée. Sans semence, pas de récolte.","q":"Mon quotidien est-il dirigé par la discipline ou par l’humeur du moment ?","w":"Structurer l’emploi du temps par blocs de travail ininterrompus de 45 minutes.","e":"Attendre l’inspiration pour commencer. À la place : commence dix minutes, l’élan suit.","dl":"1 à 6 mois.","s":["Planification rigoureuse et passage à l’acte sans délai","Production constante de travail de haute valeur","Consolidation des réseaux neuronaux de la discipline","Indépendance financière et reconnaissance socioprofessionnelle","6 mois à 3 ans"],"n":["Procrastination, hésitation et travail bâclé","Accumulation de retards et dettes opérationnelles","Ruminations anxieuses et perte de confiance en soi","Dépendance économique et marginalisation","1 à 6 mois"],"i":"« J’attends que Dieu ouvre une porte. » Non : la porte s’ouvre à celui qui frappe — et frapper, c’est travailler. Confondre la vision avec l’action est la forme la plus respectable de la paresse."},"1.2":{"p":"La seule loi économique où donner est une opération d’achat.","q":"Ressens-tu une contraction interne lorsque tu dois donner ou payer de justes rémunérations ?","w":"Établir un pourcentage fixe de tes revenus dédié à la contribution désintéressée.","e":"Donner pour manipuler Dieu, comme une pièce dans un distributeur. À la place : donne sans calcul de retour.","dl":"6 à 24 mois.","s":["Don régulier et désintéressé d’une part de ses ressources","Ouverture d’opportunités et soutien inattendu en crise","Libération du stress d’attachement matériel","Abondance durable et protection sociale","3 à 18 mois"],"n":["Rétention angoissée et avarice dans les transactions","Isolement économique et méfiance des tiers","Anxiété de perte et hypervigilance financière","Appauvrissement relationnel et perte matérielle inattendue","6 à 24 mois"],"i":"« Je donnerai quand je serai riche. » C’est inverser la cause et l’effet : on ne devient pas riche puis généreux ; la loi déclare que la générosité précède l’enrichissement."},"1.3":{"p":"La dîme n’est pas une offrande : c’est l’ordre de priorité comptable du Royaume.","q":"Le don passe-t-il avant les dépenses, ou après, quand il reste quelque chose ?","w":"Calculer la première part sur chaque entrée de la semaine (salaire, ventes, primes).","e":"Donner ce qu’il reste en fin de mois. À la place : sépare la première part dès que l’argent entre.","dl":"1 à 5 ans.","s":["Prélever la première part dès l’entrée du revenu","Budget plus clair : les dépenses s’ajustent au reste","Discipline de l’ordre, moins de fuites financières","Libéralité durable et confiance dans la provision","3 à 12 mois"],"n":["Ne donner que ce qui reste en fin de mois","Jamais de reste : le don est sans cesse repoussé","Habitude de rétention, anxiété financière de fond","Générosité jamais pratiquée, sentiment de manque persistant","1 à 5 ans"],"i":"« Je donnerai quand j’aurai assez. » La dîme ne se calcule pas sur le confort mais sur le revenu — 10 % de 1 000 restent plus faciles que 10 % de 10 000."},"1.4":{"p":"Jésus a sanctifié le calcul : on s’assied, on compte, puis on bâtit.","q":"Combien de projets commencés ces deux dernières années ont été abandonnés en cours de route ?","w":"Poser des marges de sécurité de 20 % sur le temps et le budget prévus.","e":"Appeler « foi » une décision jamais chiffrée. À la place : chiffre d’abord, avance ensuite.","dl":"1 à 6 mois.","s":["Chiffrage prévisionnel et étude des risques","Maîtrise des délais et fin des projets entrepris","Sérénité décisionnelle","Réussite structurelle et crédibilité solide","Durée totale du projet"],"n":["Lancement d’initiatives sur impulsion sans budget réaliste","Épuisement financier et projets abandonnés","Frustration et perte du sens de l’organisation","Ruine des ressources et réputation de volatilité","1 à 6 mois"],"i":"« Je fais confiance à Dieu, je ne budgète pas. » Faux : la foi n’a jamais dispensé du calcul — Jésus en fait l’illustration même du coût de l’engagement. Confondre foi et improvisation, c’est baptiser le désordre."},"1.5":{"p":"Le capital enterré n’est pas protégé : il est confisqué.","q":"Laisses-tu des petites tâches inaccomplies sous prétexte qu’elles sont mineures ?","w":"Réhabiliter un engagement mineur mais impayé ou oublié.","e":"Enterrer son talent par peur d’échouer. À la place : fais un petit essai cette semaine.","dl":"3 à 12 mois.","s":["Traitement rigoureux des détails insignifiants en apparence","Absences d’erreurs majeures et fluidité du service","Renforcement des structures de vigilance","Élévation naturelle vers des responsabilités supérieures","1 à 2 ans"],"n":["Tolérance face aux petits compromis et aux négligences","Erreurs en chaîne et fuite des ressources","Dégradation progressive de l’éthique personnelle","Déclassement et perte de confiance générale","3 à 12 mois"],"i":"« J’attends le bon moment, le signe, la confirmation. » Le serviteur à un talent attendait lui aussi — par peur. L’Écriture nomme cette attente : paresse déguisée en prudence. Le « moment parfait »"},"1.6":{"p":"Chaque crédit signé est un transfert de maîtrise. La Bible appelle cela de la servitude.","q":"Une part significative de tes revenus mensuels sert-elle à rembourser des consommations passées ?","w":"Adopter la méthode du remboursement en boule de neige (payer la plus petite dette en premier).","e":"Prier pour la libération en signant le crédit suivant. À la place : ferme l’entrée avant de prier pour la sortie.","dl":"1 à 3 ans.","s":["Refus du crédit de consommation et désendettement méthodique","Croissance des fonds propres et maîtrise du budget","Restauration du sentiment de liberté et de paix","Souveraineté financière et capacité d’investissement","1 à 5 ans"],"n":["Recours systématique à l’emprunt pour financer le niveau de vie","Cumul des intérêts passifs et précarité budgétaire","Anxiété de défaut et perte progressive d’options de vie","Insolvabilité et perte de patrimoine","1 à 3 ans"],"i":"« Dieu va me sortir de cette dette » — tout en signant le crédit suivant. Prier pour la libération financière en continuant d’alimenter la machine à intérêts, c’est demander la sortie de prison tout en prolongeant soi-même sa…"},"2.1":{"p":"Le repos n’est pas une pause dans le travail : c’en est une partie.","q":"Parviens-tu à déconnecter complètement ton esprit des affaires une journée entière par semaine ?","w":"Bloquer une journée entière sans aucun engagement productif ni lecture professionnelle.","e":"Faire le Sabbat en scrollant six heures. À la place : choisis un vrai arrêt, sans travail ni écran passif.","dl":"3 à 12 mois.","s":["Arrêt total du travail un jour par semaine","Vitalité renouvelée et créativité décuplée","Régularisation des rythmes endocriniens","Longévité et productivité soutenue sur des décennies","Immédiat à 1 mois"],"n":["Travail continu 7 jours sur 7","Baisse de rendement, erreurs critiques et irritabilité","Épuisement des surrénales et inflammation tardive","Effondrement physique ou psychologique forcé","3 à 12 mois"],"i":"« Je suis trop occupé par l’œuvre de Dieu pour me reposer. » Le burn-out n’est pas un martyre spirituel : c’est une violation du commandement n°4."},"2.2":{"p":"Tu ne possèdes pas ton corps : tu en es l’intendant. Et l’intendant rend compte de ce qu’on lui a confié.","q":"Passes-tu plus de 8 heures par jour assis sans interrompre cette position par de l’exercice ?","w":"Intégrer trois séances d’effort musculaire de 20 minutes dans ta routine hebdomadaire.","e":"Opposer l’esprit et le corps comme deux mondes. À la place : le corps est le lieu où l’esprit agit.","dl":"6 mois à 3 ans.","s":["Marche rapide ou exercice soutenu quotidien","Amélioration du tonus, meilleure posture","Neurogenèse et optimisation du profil lipidique","Autonomie physique durable et résistance à l’effort","2 semaines à 3 mois"],"n":["Sédentarité prolongée et absence d’effort physique","Atrophie musculaire, douleurs de dos, essoufflement","Perte de densité osseuse et ralentissement métabolique","Vulnérabilité physique et dépendance précoce","6 mois à 3 ans"],"i":"« Mon corps ne compte pas, seul l’esprit compte. » Faux dualisme : Paul déclare le corps « temple », pas ruine négligeable."},"2.3":{"p":"L’excès n’est jamais gratuit : il se paie en lucidité, en santé et en argent — avec intérêts.","q":"Utilises-tu la nourriture ou des substances comme compensations émotionnelles ?","w":"Éliminer complètement les boissons sucrées et l’alcool.","e":"Invoquer la liberté en Christ pour tout se permettre. À la place : « tout m’est permis » n’est pas « tout est utile ».","dl":"2 à 10 ans.","s":["Alimentation modérée, sans toxiques ni excès","Poids de santé, énergie constante et teint sain","Réduction des marqueurs inflammatoires (CRP bas)","Longévité, absence de maladies métaboliques","1 à 6 mois"],"n":["Suralimentation, produits ultra-transformés, abus de stimulants","Prise de poids, léthargie post-repas et fatigue","Résistance à l’insuline et stéatose hépatique","Pathologies chroniques et déclin prématuré","2 à 10 ans"],"i":"« J’ai la liberté en Christ, tout m’est permis. » Paul répond lui-même au verset suivant : « tout m’est permis, mais tout n’est pas utile » (1 Corinthiens 6:12)."},"2.4":{"p":"Le sommeil n’est pas une perte de temps mais une obligation biologique et spirituelle de remise de nos limites entre les mains de Dieu.","q":"Te couches-tu à des heures différentes chaque soir ?","w":"Fixer une heure de coucher et la tenir cinq soirs sur sept.","e":"Se vanter de dormir peu. À la place : le manque de sommeil abîme le jugement.","dl":"1 semaine à 1 an.","s":["Heure de coucher fixe, 7-8 h de sommeil","Réveil plus facile, humeur stable","Mémoire consolidée, cortisol régulé","Performance durable et cœur préservé","Immédiat à 2 semaines"],"n":["Veilles répétées, écrans au lit","Fatigue, irritabilité, café en cascade","Attention et jugement dégradés","Erreurs coûteuses, usure cardiométabolique","1 semaine à 1 an"],"i":"« Les gens efficaces dorment peu. » Le Psaume 127:2 dit l’inverse : Dieu donne « pendant leur sommeil » à ses bien-aimés. Et la personne privée de sommeil est la dernière à voir sa propre baisse de performance."},"2.5":{"p":"Passer outre les rythmes naturels de la lumière, des saisons et de l’âge induit un désalignement biologique destructeur.","q":"Ta journée dépend-elle plus de la lumière artificielle que de la lumière du jour ?","w":"Fixer des horaires de repas réguliers et une exposition matinale à la lumière.","e":"Vivre sous lumière artificielle du matin au soir. À la place : prends la lumière du jour dès le réveil.","dl":"6 mois à 5 ans.","s":["Lumière du jour dès le réveil, nuit sombre","Endormissement plus rapide, énergie régulière","Mélatonine et cortisol alignés","Santé métabolique et humeur stables","1 à 4 semaines"],"n":["Écrans tardifs, repas et nuits décalés","Réveils lourds, coups de fatigue","Mélatonine supprimée, horloge désynchronisée","Troubles métaboliques et du sommeil installés","6 mois à 5 ans"],"i":"« Je m’adapte à n’importe quel rythme. » Le Psaume 104:19 rappelle que la lune et le soleil marquent les temps : l’ordre est inscrit dans la création."},"2.6":{"p":"L’environnement matériel direct influence l’état biologique et mental de l’occupant. L’ordre extérieur soutient l’ordre intérieur.","q":"Y a-t-il une pièce où tu évites d’entrer ou de t’asseoir ?","w":"Ranger un espace précis chaque jour dix minutes (bureau, entrée, chambre).","e":"Ranger un week-end puis laisser tout retomber. À la place : installe un petit rituel quotidien.","dl":"3 mois à 2 ans.","s":["Aérer, nettoyer, désencombrer par petits gestes réguliers","Pièces plus claires, moins de recherches d’objets","Moins d’allergènes, charge mentale allégée","Clarté d’esprit et sérénité durables","Immédiat à 1 mois"],"n":["Laisser s’accumuler désordre et saleté","Pièces encombrées, temps perdu à chercher","Surcharge visuelle, fatigue d’attention","Confusion mentale, hôtes évités","3 mois à 2 ans"],"i":"« Le désordre, c’est ma créativité. » Parfois ; mais pour la plupart des gens, le désordre chronique n’est pas un choix créatif, c’est une dette d’attention qui s’accumule en silence."},"2.7":{"p":"L’inquiétude est une roue qui tourne dans le vide sans rien produire. La Bible ordonne de s’en défaire.","q":"Mes soucis du jour sont-ils traités par l’action ou par la rumination ?","w":"Fixer une heure de revue des soucis : pour chacun, une action planifiée ou une remise explicite.","e":"Prier puis reprendre le souci comme un colis. À la place : dis « je remets » et passe à l’action prévue.","dl":"2 à 12 mois.","s":["Concentration sur l’action présente et ancrage dans la confiance : chaque souci est confié, puis la tâche du moment reprend","Moins de rumination, attention revenue sur ce qui est faisable aujourd’hui","Réduction du cortisol, baisse de la tension de fond, sommeil plus facile à trouver","Lucidité dans les décisions, paix stable, énergie préservée","1 à 4 semaines"],"n":["Projection catastrophiste constante, souci repris après avoir été confié","Fatigue mentale, décisions repoussées, irritabilité","Surcharge du système de stress, sommeil haché, fatigabilité","Épuisement et paralysie","2 à 12 mois"],"i":"« Je m’inquiète parce que je suis responsable. » Non : la responsabilité agit, l’inquiétude tourne en rond. Si le problème a une action possible → fais-la (Loi 1.1). S’il n’en a pas → décharge-le (1 Pierre 5:7)."},"2.8":{"p":"Celui qui ne gouverne pas ses impulsions est gouverné par elles. La Bible appelle cela une ville sans muraille.","q":"Qu’est-ce qui décide à ma place : mes impulsions ou mes décisions ?","w":"Écrire tes trois déclencheurs principaux et la réponse prévue pour chacun, avant qu’ils ne se présentent.","e":"Dire « je suis comme ça » pour excuser ses emportements. À la place : nomme le déclencheur et pose un mur.","dl":"6 mois à 3 ans.","s":["Poser des murs avant l’assaut : délais, blocages, limites écrites, maîtrise des impulsions et fidélité","Réactions mesurées ; moins de messages, d’achats et de colères regrettés","Intégrité émotionnelle, profondeur du lien, notamment dans le couple","Paix de la conscience et autorité sur soi-même","1 à 3 mois"],"n":["Laisser un accès libre à toute stimulation et réagir à chaud","Recherche de stimulations désordonnées, regrets répétés","Désensibilisation dopaminergique, honte et anxiété","Rupture des relations et dépendance","6 mois à 3 ans"],"i":"« Je suis fait comme ça, je suis quelqu’un de passionné. » La Bible classe cette phrase sous « ville sans muraille ». La passion est un moteur ; sans freins ni direction, elle détruit ce qu’elle prétend servir."},"2.9":{"p":"Celui qui gagne la première heure a déjà gagné la journée — et celui qui gagne les journées gagne la destinée.","q":"Quelle est la première chose que tu regardes ou que tu fais chaque matin ?","w":"Fixer une heure de lever tenue cinq jours sur sept et préparer la veille.","e":"Veiller tard puis prier pour la discipline matinale. À la place : prépare le matin dès la veille.","dl":"6 mois à plusieurs années.","s":["Réserver la première heure à l’alignement, sans écran","Matin calme, priorités claires","Moins de réactivité, décisions plus nettes","Journées ordonnées qui se composent en destinée","2 à 6 semaines"],"n":["Ouvrir la journée par les notifications et les urgences d’autrui","Matinée dispersée, retard sur l’essentiel","Pilotage par la demande des autres","Années passées à réagir, objectifs reportés","6 mois à plusieurs années"],"i":"« Je suis du soir, Dieu me connaît. » La question n’est pas la chronobiologie mais la séquence : quelle que soit l’heure du lever, la première heure définit l’ordre du jour — ou le désordre."},"3.1":{"p":"Tu deviens la moyenne des cinq personnes que tu fréquentes le plus. Choisis-les.","q":"Mon entourage me tire-t-il vers le haut ou vers le bas ?","w":"Contacter une personne dont tu admires la trajectoire et fixer un échange ou un repas.","e":"Rester dans un cercle toxique « pour les influencer ». À la place : la contagion va dans les deux sens, protège-toi.","dl":"1 à 5 ans.","s":["Choisir ses fréquentations avec soin et s’entourer de personnes qui élèvent","Entourage rigoureux : conversations, standards et habitudes tirent vers le haut","Alignement progressif sur les normes, le langage et les ambitions du groupe","Évolution personnelle rapide","6 mois à 3 ans"],"n":["Fréquenter durablement des personnes cyniques ou toxiques","Plaintes, moqueries et excuses deviennent le fond sonore","Normalisation de la médiocrité","Chute morale et sociale","1 à 5 ans"],"i":"« Je reste avec eux pour les influencer. » La loi ne connaît pas le sens du flux : la contagion suit la fréquence et l’intensité, pas les intentions."},"3.2":{"p":"Le ressentiment est un locataire qui ne paie jamais : il occupe ton esprit pour le compte de quelqu’un d’autre.","q":"Conserves-tu de la rancune ou de la colère dès que le nom d’une personne en particulier est évoqué ?","w":"Écrire une lettre de libération de dette (sans nécessairement l’envoyer si le contact est toxique).","e":"Attendre les excuses de l’autre pour pardonner. À la place : le pardon se décide sans condition.","dl":"Continu et cumulatif.","s":["Abandon explicite du désir de vengeance ou de punition","Diminution de la tension relationnelle","Libération des charges émotionnelles négatives","Paix intérieure, rétablissement de la santé physique et liberté","Immédiat à quelques semaines"],"n":["Entretien de l’amertume et de la rancœur","Agressivité réactive et isolement progressif","Ruminations et inflammation systémique chronique","Empoisonnement de soi-même et destruction des relations","Continu et cumulatif"],"i":"« Je pardonnerai quand il reconnaîtra ses torts. » La loi ne conditionne pas le pardon à la repentance de l’autre — sinon ton cœur reste otage de l’attitude d’un autre."},"3.3":{"p":"Un conflit est une plaie : chaque jour sans soin, elle s’infecte en ressentiment.","q":"Y a-t-il une personne avec qui un différend dure depuis plus d’un jour ?","w":"Reformuler le point de l’autre avant d’exposer le tien lors d’un désaccord.","e":"Prier pour le frère au lieu d’aller le voir. À la place : « va » est un verbe d’action.","dl":"quelques semaines à plusieurs années.","s":["Aborder le différend le jour même, en privé, avec douceur","Tension qui retombe, explication entendue","Pas de coalitions ni de versions parallèles","Relation préservée, plus solide après l’épreuve","immédiat à quelques jours"],"n":["Se taire, bouder ou en parler à d’autres","Climat froid, évitement","Interprétations qui grossissent, alliances défensives","Amertume installée, relation rompue","quelques semaines à plusieurs années"],"i":"« Je prie pour lui, ça ira mieux. » La loi n’ordonne pas de prier pour le frère mais d’aller vers le frère — « va » est un verbe de mouvement, pas de méditation. La prière sans déplacement est une fuite déguisée."},"3.4":{"p":"La grandeur véritable et l’influence réelle découlent de la capacité à servir le bien d’autrui sans chercher de rétribution immédiate.","q":"À qui as-tu rendu service cette semaine sans qu’on te le demande ?","w":"Choisir une personne et lui rendre un service précis, gratuit.","e":"Servir pour se faire aimer en retour. À la place : le service libre n’attend pas de reçu.","dl":"6 mois à 5 ans.","s":["Rendre un service concret, discret, régulier","Sourires, reconnaissance, liens plus chaleureux","Confiance et dette morale positive","Réseau fidèle et influence naturelle","Quelques semaines à quelques années"],"n":["Exploiter les autres pour son profit","Gains rapides, relations froides","Méfiance générale, isolement","Perte de soutien au premier revers","6 mois à 5 ans"],"i":"« Je servirai quand j’aurai réussi. » Jésus n’attend pas la réussite : le service précède la grandeur, pas l’inverse. Et servir pour être aimé n’est pas du service, c’est un échange déguisé."},"3.5":{"p":"La manière dont nous traitons autrui détermine exactement la manière dont nous serons traités par le corps social à terme.","q":"Quelle personne de ton entourage traites-tu mieux en face que dans son dos ?","w":"Complimenter sincèrement trois personnes, avec un fait précis à l’appui.","e":"Critiquer en privé puis s’étonner de la méfiance. À la place : les paroles reviennent toujours.","dl":"1 à 5 ans.","s":["Respect et encouragements semés","Climat de confiance qui s’installe","Réciprocité qui revient sans qu’on la réclame","Entourage loyal et solidaire","Quelques semaines à 2 ans"],"n":["Mépris, critique en coulisse, médisance","Défiance, conversations qui se ferment","Réputation qui circule en mal","Rejet et trahison au moment de besoin","1 à 5 ans"],"i":"« Je dis ce que je pense, tant pis pour eux. » La franchise n’exige pas le mépris. Et ce que tu dis de l’absent, ton interlocuteur le sait capable de le dire de lui. Les paroles reviennent toujours."},"3.6":{"p":"Le mariage est le champ le plus fertile ou le plus ingrat : tout y pousse, le bien comme le mal.","q":"Mon couple est-il traité comme une priorité ou comme un reste de temps ?","w":"Prévoir un moment à deux sans écran et le protéger dans l’agenda.","e":"Donner au ministère ou au travail ce qui revient au foyer. À la place : le foyer est le premier champ.","dl":"6 mois à 5 ans.","s":["Fidélité et investissement quotidien dans le couple","Sécurité affective et stabilité","Confiance qui se renforce, équipe soudée face aux épreuves","Héritage émotionnel solide","1 à 5 ans"],"n":["Infidélité, rupture de parole ou négligence du foyer","Distance, non-dits, conflits répétés","Traumatisme affectif et frais de rupture","Chaos familial durable","6 mois à 5 ans"],"i":"« Je me donne pour le ministère, le business, la mission — ma famille comprend. » Les lois disent le contraire : le foyer est le premier ministère."},"3.7":{"p":"L’honneur est la monnaie d’échange du Royaume : ce que tu honores s’approche, ce que tu méprises s’éloigne.","q":"Quand as-tu parlé à tes parents — ou à leur mémoire — avec respect et gratitude, sans attendre qu’ils changent ?","w":"Passer un moment sans débat : écouter leur histoire et noter ce qu’ils t’ont transmis de bon.","e":"Honorer Dieu en méprisant les hommes qu’il a placés. À la place : on l’honore à travers eux.","dl":"1 à 10 ans.","s":["Parler avec respect à ses parents, les visiter, les soutenir concrètement","Tensions familiales apaisées, liens renoués","Fin de la rumination de colère, identité plus stable","« Longueur de jours » : santé, descendance bénie, paix de famille","premiers effets en quelques mois ; plénitude sur une vie entière"],"n":["Mépris, silence ou ressentiment entretenu envers ses parents","Ruptures familiales, scènes devant les enfants","Colère chronique, schéma transmis à la génération suivante","Isolement en vieillissant, schéma répété par les enfants","1 à 10 ans"],"i":"« J’honore Dieu, pas les hommes. » Les lois disent l’inverse : on honore Dieu à travers les hommes qu’il a placés — parents, pasteurs, autorités, employeurs."},"3.8":{"p":"Ce qui n’est pas transmis est perdu : chaque génération repart de zéro ou de l’épaule de la précédente.","q":"As-tu déjà dit à voix haute, à ton enfant ou à un plus jeune, quel principe guide ta famille ?","w":"Écrire une page « ce que je veux transmettre » : valeurs, pardons, nom du Seigneur.","e":"Tout déléguer à l’école, à l’église ou à Internet. À la place : la transmission commence à la maison.","dl":"1 à 2 générations.","s":["Dire et écrire les principes de la famille ; confier des responsabilités réelles aux plus jeunes","Enfants et disciples qui raisonnent avec la boussole familiale","Continuité des valeurs, mémoire vivante de la famille","Patrimoine — biens et caractère — préservé sur trois générations","10 à 30 ans"],"n":["Transférer l’argent sans les principes, garder le silence sur l’histoire familiale","Héritiers désarmés face au patrimoine","Dispersion, conflits de succession","Le fruit du travail passe à d’autres (cf. Proverbes 5:10)","1 à 2 générations"],"i":"« L’école, l’église ou Internet s’en chargeront. » La délégation totale est une démission : la loi assigne la transmission aux parents, dans la maison, quotidiennement."},"4.1":{"p":"Le respect de l’ordre et des lois légitimes protège le tissu social de la décomposition anarchique.","q":"Y a-t-il une obligation administrative, fiscale ou légale que tu reportes ?","w":"Régler une démarche en retard (déclaration, assurance, papiers).","e":"Obéir à contrecœur en grommelant. À la place : la soumission vraie est de cœur.","dl":"Quelques mois à plusieurs années.","s":["Se mettre en règle sur les obligations légales","Sécurité juridique, moins de stress administratif","Crédibilité et paix avec l’entourage","Liberté réelle, protégée par l’ordre","Immédiat"],"n":["Fraude, contournement, rébellion de principe","Gains rapides, tensions avec l’administration","Risque de sanction, réputation entamée","Condamnation et perte de liberté","Quelques mois à plusieurs années"],"i":"« La règle est injuste, donc je peux l’ignorer. » Il existe des lois à contester, mais par les voies légitimes. Le contournement privé ne réforme rien : il entretient seulement la défiance. Et « tout le monde le fait »"},"4.2":{"p":"L’orgueil est une erreur de place : il te fait croire propriétaire d’un domaine dont tu n’es que le locataire.","q":"Quelle décision récente as-tu prise sans consulter personne de plus compétent que toi ?","w":"Écrire trois compétences que tu n’as pas et identifier qui les possède autour de toi.","e":"Se vanter pour être remarqué. À la place : laisse un autre te louer.","dl":"6 mois à 3 ans.","s":["Dire « je ne sais pas », demander conseil, apprendre de subordonnés et d’étrangers","Erreurs corrigées avant catastrophe, compétences nouvelles","Certitudes remises à l’échelle, jugement affûté","Élévation durable : « il sera élevé »","1 à 5 ans"],"n":["Décider seul, certain d’être le plus compétent de la salle","Erreurs non corrigées, faute de contre-pouvoir","Angle mort grandissant, entourage réduit aux flatteurs","Chute publique : « l’orgueil précède la ruine » (Proverbes 16:18)","6 mois à 3 ans"],"i":"« Si je ne me vante pas, personne ne me remarquera. » Proverbes 27:2 répond : « Qu’un autre te loue, et non ta bouche ». La louange externe a une portée ; l’auto-promotion a une odeur — et tout le monde la sent."},"4.3":{"p":"Dans le Royaume, l’ascenseur social fonctionne à l’envers : il descend ceux qui montent et monte ceux qui descendent.","q":"La semaine dernière : combien de problèmes as-tu retirés des autres — et combien as-tu créés à autrui ?","w":"Demander à ton équipe ou ta famille : « quel problème puis-je vous enlever ? »","e":"Attendre la promotion pour servir pleinement. À la place : sers d’abord, la promotion suit.","dl":"1 à 3 ans.","s":["Prendre la tâche la plus ingrate de l’équipe, régler les problèmes d’autrui avant les siens","Crédit de confiance, équipe qui avance sans surveillance","Capital de légitimité qui croît en silence","Promotion par le service : « qu’il soit votre serviteur »","6 mois à 3 ans"],"n":["Attendre le titre pour donner, exiger sans montrer l’exemple","Cynisme de l’équipe, « on fait le minimum »","Autorité qui s’use à chaque ordre","Plafond de carrière : « on ne lui obéit plus »","1 à 3 ans"],"i":"« J’attends ma promotion pour servir pleinement. » L’ordre est inversé : la promotion suit le service, jamais l’inverse. Attendre le titre pour produire la valeur, c’est demander la moisson avant la semence."},"4.4":{"p":"Une vision non écrite est un rêve ; une vision écrite est un plan de vol déposé.","q":"Pourrais-tu écrire en une page ta destination à cinq ans ?","w":"Choisir trois jalons et les placer dans ton agenda.","e":"Garder la vision « dans le cœur » sans l’écrire. À la place : la mémoire déforme, l’écrit corrige.","dl":"1 à 10 ans.","s":["Écrire la vision et les jalons, et les relire chaque semaine","Décisions plus rapides, refus plus faciles","Énergie concentrée, moins de dispersion","Accomplissement au temps fixé, équipe alignée","1 à 12 mois"],"n":["Garder la vision floue, dans la tête","Projets multiples, rien de terminé","Priorités qui changent au gré des occasions","Années dispersées, cap jamais atteint","1 à 10 ans"],"i":"« J’ai la vision dans le cœur, pas besoin de l’écrire. » Habaquq reçoit l’ordre d’écrire précisément parce que la mémoire déforme et que le découragement réécrit. Ce qui n’est pas gravé se négocie ; ce qui est gravé se poursuit."},"4.5":{"p":"L’intégrité est la seule fondation qui ne demande jamais d’expertise ni de réparation.","q":"Y a-t-il un chiffre, une promesse ou un récit que tu arranges légèrement ?","w":"Appliquer le test du journal : ne rien faire que tu n’accepterais de voir publié.","e":"Justifier un raccourci par « tout le monde fait ainsi ». À la place : la loi n’a pas de clause sectorielle.","dl":"1 à 10 ans.","s":["Une seule version des faits, en public comme en privé","Moins de mensonges à entretenir, sommeil tranquille","Réputation de fiabilité qui s’accumule","Confiance durable, direction assurée","6 mois à plusieurs années"],"n":["Petits arrangements, double discours, raccourcis tordus","Gains rapides, dossiers à cacher","Dette de cohérence, mémoire du mensonge à entretenir","Découverte, perte de confiance, effondrement","1 à 10 ans"],"i":"« Tout le monde fait comme ça dans ce secteur. » La loi n’a pas de clause sectorielle. Le raccourci qui « marche » pour les autres produit le même résultat — il arrive juste à échéance différente."},"4.6":{"p":"Décider seul, c’est signer un contrat jamais relu : la faille est déjà dedans.","q":"Sur ta dernière décision importante, combien de personnes compétentes ont-elles pu te dire non avant que tu ne décides ?","w":"Lister tes trois conseillers (argent, métier, caractère) et prendre rendez-vous.","e":"Dire « Dieu m’a parlé » pour éviter toute délibération. À la place : une vraie parole supporte l’examen.","dl":"6 mois à 2 ans.","s":["Constituer un cercle de trois à cinq conseillers et les consulter avant tout engagement majeur","Décisions amendées, angles morts fermés avant l’impact","Certitudes testées, ego rogné sans douleur","« Les projets réussissent » : réussite stable, réputation de sagesse","la durée de chaque projet"],"n":["Décider seul, ou ne consulter que des supporters","Erreurs répétées, projets abandonnés","Illusion de certitude, dépendance à l’écho","« Le peuple tombe » : l’effondrement est collectif, pas seulement personnel","6 mois à 2 ans"],"i":"« Dieu m’a parlé, je n’ai besoin de personne. » La révélation qui ne supporte pas la délibération n’est pas du Ciel — elle est du moi."},"4.7":{"p":"Depuis le jardin d’Éden, « ce n’est pas ma faute » est le premier réflexe de l’histoire humaine — jamais guéri par la plainte.","q":"Quelle situation actuelle expliques-tu surtout par la faute de quelqu’un d’autre ?","w":"Reconnaître à voix haute une erreur à la personne concernée, sans justification.","e":"Tout attribuer à « l’attaque de l’ennemi ». À la place : cherche d’abord ta part concrète.","dl":"6 mois à plusieurs années.","s":["Dire « j’ai choisi, j’ai négligé, j’ai permis » sans transférer la faute","Excuses plus rapides, conversations plus courtes","Capacité d’action retrouvée, apprentissage de l’erreur","Autorité, confiance, trajectoire pilotée","immédiat à 6 mois"],"n":["Accuser les circonstances, les autres, la conjoncture","Soulagement bref","Perte de pouvoir sur la situation, erreurs répétées","Impuissance durable, relations tendues","6 mois à plusieurs années"],"i":"« C’est une attaque de l’ennemi. » Parfois. Mais la majorité des « attaques spirituelles » sont des conséquences mécaniques : budget non calculé (Loi 1.4), conflit non traité (Loi 3.3), corps non entretenu (Loi 2.2)."},"4.8":{"p":"La sévérité ou la partialité que nous appliquons à l’évaluation d’autrui devient le critère rigide par lequel notre propre conduite sera examinée.","q":"Sur quelle personne absente as-tu porté un jugement définitif récemment ?","w":"Avant de critiquer, reformuler le fait neutre et poser une question.","e":"Juger l’intention d’autrui sur un acte isolé. À la place : décris le fait, pas le cœur.","dl":"1 à 5 ans.","s":["Décrire le fait, interroger avant de conclure","Conversations plus calmes","Confiances qui se libèrent","Indulgence reçue quand on échoue à son tour","Quelques semaines à 1 an"],"n":["Étiqueter, condamner sur un acte isolé","Réponses défensives, tension","Cercle de défiance, polarisation","Condamnation sans grâce au premier faux pas","1 à 5 ans"],"i":"« Je ne juge pas, je dis les choses telles qu’elles sont. » Décrire un fait n’est pas juger ; deviner un cœur, si. La question à se poser : est-ce que j’accepterais qu’on me juge avec cette mesure ?"},"4.9":{"p":"Le juste paiement des compétences et des efforts garantit la loyauté et la pérennité du système économique.","q":"À qui dois-tu un paiement ou une reconnaissance que tu retardes ?","w":"Régler toutes les factures échues et créditer par leur nom ceux qui ont contribué à un projet.","e":"Retarder un paiement dû pour ménager sa trésorerie. À la place : paie le jour de l’échéance.","dl":"6 mois à 3 ans.","s":["Payer le juste prix, au jour dit","Équipes motivées, prestataires fidèles","Réputation de sérieux qui circule","Prospérité partagée et durable","Quelques semaines à 1 an"],"n":["Retarder, rogner, profiter du travail d’autrui","Économie de trésorerie immédiate","Démotivation, départs, travail bâclé","Perte de confiance, ruine du service","6 mois à 3 ans"],"i":"« Je paierai quand ma trésorerie le permettra. » Le Deutéronome parle du salaire « le jour même ». La trésorerie du payeur n’est pas le problème de celui qui a travaillé : c’est une dette, non une option."},"5.1":{"p":"Tes phrases ne décrivent pas ta réalité : elles la construisent.","q":"Quelles phrases sur toi-même, ta famille et ton avenir as-tu répétées plus de dix fois ce mois-ci ?","w":"Écrire trois déclarations de direction (moi, maison, travail) et les lire chaque matin.","e":"Dire « ce ne sont que des mots ». À la place : chaque parole est une semence.","dl":"6 mois à 2 ans.","s":["Déclarer selon la promesse, nommer la solution au lieu du problème, bénir au lieu de maudire","Ambiance changée, auditeurs encouragés","Croyances reconfigurées, attention réglée sur l’ouverture","« Quiconque l’aime en mangera les fruits » : la vie répond aux phrases dominantes","1 à 5 ans"],"n":["Plaintes, déclarations de défaite, étiquettes posées sur autrui","Découragement collectif, occasions manquées","Croyance de l’échec gravée, cécité aux portes","« Tu es enlacé par les paroles de ta bouche » (Proverbes 6:2)","6 mois à 2 ans"],"i":"« Ce ne sont que des mots, je ne le pense pas vraiment. » Le cerveau ne distingue pas bien le sarcasme de la foi — il enregistre la fréquence. La plainte « pour rire »"},"5.2":{"p":"La parole est une ressource limitée : chaque mot inutile dilue la valeur de tous les autres.","q":"Combien de confiances reçues ces trois derniers mois n’ont dépassé aucune de tes conversations ?","w":"Retirer un projet ou une nouvelle de toutes les conversations publiques jusqu’à sa maturité.","e":"Tout dire au nom de l’authenticité. À la place : l’insensé déverse tout, le sage se retient.","dl":"1 à 6 mois.","s":["Se taire sur les projets non mûrs, les confidences reçues, les répliques chaudes","Réputations intactes, projets protégés jusqu’à maturité","Réserve d’énergie mentale, crédit de fiabilité","« Qui garde sa bouche garde son âme » : la confiance des décideurs","3 à 12 mois"],"n":["Tout dire, tout commenter, tout publier","Portes fermées, secrets trahis, promesses détruites","Indexation de soi comme « indiscret » dans tous les réseaux","Exclusion des cercles où se prennent les vraies décisions","1 à 6 mois"],"i":"« Je dois tout dire, sinon je ne suis pas authentique. » La transparence totale n’est pas une vertu biblique : « l’insensé déverse tout son esprit » (Proverbes 29:11). La sagesse est une curatelle, pas une évacuation."},"5.3":{"p":"Ton esprit est un jardin : la conformité est la friche, le renouvellement est le labour.","q":"Quel livre — hors réseaux sociaux — as-tu terminé récemment, et qu’as-tu changé dans ta vie grâce à lui ?","w":"Choisir le livre du mois et noter une page d’application par chapitre lu.","e":"Croire que la nouvelle naissance renouvelle la pensée automatiquement. À la place : le renouvellement est un travail.","dl":"3 à 12 mois.","s":["Lire chaque jour dans les deux livres — la Parole et les bons livres — et écarter les flux qui remplacent la pensée","Vocabulaire élargi, jugements plus fins","Croyances démodées remplacées, attention profonde restaurée","« La sagesse repose dans le cœur de l’homme intelligent » : les décisions s’améliorent d’abord, puis la vie","3 à 18 mois"],"n":["Laisser l’algorithme décider de ce qu’on pense, huit heures par jour","Opinions préfabriquées, irritabilité face aux contradictions","Atrophie de l’attention profonde, pensée en slogans","Un cerveau formaté par des intérêts qui ne sont pas les tiens","3 à 12 mois"],"i":"« Je suis né de nouveau, ma pensée est automatiquement renouvelée. » Romains 12:2 s’adresse à des croyants : la nouvelle naissance change l’esprit, pas encore le raisonnement."},"5.4":{"p":"L’attention est la porte du cœur : ce que tu regardes sans cesse finit par te gouverner.","q":"Combien d’heures par jour passent sur des contenus que tu n’as pas choisis ?","w":"Fixer un budget d’attention (création, apprentissage, repos, flux) pour la semaine.","e":"Dire « je regarde, mais ça ne m’affecte pas ». À la place : il n’y a pas de vision neutre.","dl":"6 mois à plusieurs années.","s":["Décider ce que je regarde et pour combien de temps","Moins de dispersion, plus de profondeur","Esprit moins saturé, décisions plus nettes","Clarté durable, projets menés à terme","2 à 8 semaines"],"n":["Laisser les flux capter l’attention sans limite","Heures perdues, fatigue mentale","Pensées dictées par les algorithmes, anxiété de fond","Trajectoire détournée, vie réactive","6 mois à plusieurs années"],"i":"« Je regarde, mais ça ne m’affecte pas. » Matthieu 6 dit le contraire : l’œil est une lampe — il n’y a pas de vision neutre. Chaque heure de ce que tu reçois éclaire ou obscurcit toute ta vie ; l’« je gère »"},"5.5":{"p":"Ta parole est ta signature : chaque engagement tenu la grave, chaque excuse l’efface.","q":"Combien de oui en suspens pèsent sur ta semaine — messages non retournés, dettes, livrables ?","w":"Passer en revue les engagements ouverts : tenir ou renoncer explicitement, un par un.","e":"Dire « je ferai de mon mieux » pour ne rien promettre. À la place : dis oui ou non, clairement.","dl":"6 mois à 2 ans.","s":["Promettre moins, tenir tout : date, montant, livrable précis","Réputation d’exactitude, moins de relances","Cerveau libéré de la gestion des oublis","La confiance devient un actif qui travaille seul","1 à 3 ans"],"n":["Dire oui pour plaire, puis reporter, puis « oublier »","Réunions de rattrapage, excuses répétées","Cartographie mentale des dettes de parole","Évaporation du crédit : on ne te recommande plus pour rien d’important","6 mois à 2 ans"],"i":"« Je ferai de mon mieux » — la phrase refuge qui promet tout et n’engage rien. Dieu ne comptabilise ni les efforts ni les intentions : il enregistre les oui et les non. Mieux vaut un non fiable qu’un oui fluctuant."},"5.6":{"p":"Le cœur croit, la bouche confirme : ce que je dis tout haut finit par me guider.","q":"Quelles phrases te dis-tu le plus souvent sur ton avenir et sur toi-même ?","w":"Remplacer chaque phrase d’auto-sabotage par une version factuelle et tenable.","e":"Confesser la victoire et ne rien faire d’autre. À la place : la confession accompagne la semence.","dl":"1 à 6 mois.","s":["Déclarer ma direction et mes engagements avec des mots justes, avant la preuve","Ton plus assuré, hésitations réduites","Attention orientée vers les solutions","Actions cohérentes avec la parole, confiance gagnée","2 à 8 semaines"],"n":["Répéter la peur, l’échec, la plainte","Confirmation de ses craintes","Attention fixée sur le risque, motivation en baisse","Scénario redouté nourri","1 à 6 mois"],"i":"« Je confesse la victoire, donc je n’ai rien d’autre à faire. » La confession alignée ne remplace jamais la semence : elle l’accompagne."},"5.7":{"p":"La gratitude oriente la perception vers les ressources disponibles et amplifie la capacité à les fructifier.","q":"Quand as-tu remercié quelqu’un nommément, pour un fait précis, pour la dernière fois ?","w":"Écrire une lettre ou un message de remerciement à quelqu’un.","e":"Remercier en une phrase vague. À la place : nomme des faits précis.","dl":"Progressif, sur des mois.","s":["Noter chaque jour des faits précis de gratitude","Humeur plus stable, regard plus attentif","Moins de comparaison, plus d’optimisme","Relations nourries, abondance ressentie","1 à 4 semaines"],"n":["Se plaindre en continu, ne voir que le manque","Irritation, comparaison permanente","Sentiment de manque, relations tendues","Amertume, stérilité intérieure","Progressif, sur des mois"],"i":"« Je serai reconnaissant quand j’aurai ce qui me manque. » Jésus rend grâces avant le miracle : devant cinq pains, pas devant cinq mille. Reconnaissance et abondance vont dans cet ordre."},"6.1":{"p":"La seule loi que Dieu a juré de maintenir aussi longtemps que la terre existe. Toutes les autres en sont des applications.","q":"Qu’as-tu semé cette semaine : temps, argent, paroles, efforts ? Quelle espèce domine ?","w":"Auditer la semaine : quelle espèce de semence domine, et laquelle manque ?","e":"Prier pour une moisson sans avoir semé. À la place : la prière ne remplace pas la semence.","dl":"une saison également.","s":["Semer chaque jour, en petites quantités, la bonne espèce (temps, argent, parole)","Peu de résultats visibles au début","Racines, habitudes et réputation qui se forment","Récolte abondante, de même espèce, multipliée","une saison, de quelques mois à plusieurs années"],"n":["Ne rien semer, ou semer plainte, négligence et raccourcis","Tranquillité apparente","Terrain qui se couvre de mauvaises herbes","Même espèce récoltée, multipliée","une saison également"],"i":"« Je prie pour une moisson exceptionnelle. » La prière ne produit pas de moisson : la semence en produit."},"6.2":{"p":"La foi sans l’acte n’est pas une foi faible : c’est une foi morte. Le diagnostic est de Jacques, pas de moi.","q":"Quelle prière répétée depuis plus d’un an attend encore son premier pas concret ?","w":"Identifier une prière récurrente et écrire les trois actions qu’elle suppose.","e":"Attendre de sentir la foi avant d’agir. À la place : l’acte précède souvent la certitude.","dl":"1 à 3 ans.","s":["Faire le pas concret que la Parole ordonne, avant de voir le résultat","Circonstances déplacées par l’action elle-même","Foi confirmée par l’expérience propre","Ce qu’on demandait arrive par le canal de ce qu’on a fait","semaines à années"],"n":["Croire fort et ne rien changer : prier le changement sans le semer","Aucun déplacement visible des circonstances","Doute croissant, fatigue spirituelle","La foi sans les œuvres est morte en elle-même (Jacques 2:17, 26)","1 à 3 ans"],"i":"« J’attends que la foi vienne avant d’agir. » Le mécanisme est inverse : l’acte de foi précède et produit la certitude. Abraham « partit sans savoir où il allait » — le mouvement d’abord, la carte ensuite."},"6.3":{"p":"La prière n’est pas un ticket de loterie : c’est une demande faite à un Père — avec des conditions qu’Il a Lui-même posées.","q":"Ta dernière grande prière portait-elle une Écriture précise, ou était-elle une plainte générale ?","w":"Un jeûne partiel — un repas, un écran — consacré à la décision en cours.","e":"Prier longtemps sans vérifier si la demande contredit une loi. À la place : vérifie l’alignement.","dl":"6 mois à 2 ans.","s":["Demander selon la Parole, croire, remercier avant la réponse ; jeûner pour les décisions capitales","Paix décisionnelle, timing qui s’ouvre","Relation entretenue, sensibilité restaurée","Tout ce qu’on demande en croyant, on le reçoit : la demande alignée rencontre un Dieu qui l’attend","variable — mais la paix, immédiate"],"n":["Répéter les demandes sans chercher l’alignement, ni croire, ni remercier","Silence apparent, autonomie croissante","Épaississement spirituel : on cesse d’entendre","« Vous demandez mal » (Jacques 4:3)","6 mois à 2 ans"],"i":"« J’ai tellement prié, Dieu ne répond pas. » Vérifie : ta demande contredit-elle une loi ? (Prier pour la provision en refusant le travail = demande mal posée, 2 Thessaloniciens 3:10.) Le silence face à une demande mal posée…"},"6.4":{"p":"Entendre sans faire, c’est lire le manuel d’urgence pendant que la maison brûle.","q":"Quel enseignement as-tu reçu récemment sans le mettre en pratique ?","w":"Appliquer la règle du 1:1 : chaque contenu consommé entraîne une action avant le suivant.","e":"Étudier encore le sujet pour ne pas agir. À la place : applique ce que tu sais déjà.","dl":"1 à 5 ans.","s":["Agir dans les 24 heures sur ce que j’ai compris","Peu de décalage entre savoir et faire","Conviction renforcée par l’expérience","Fondation solide, résistance à l’épreuve","immédiat à 3 mois"],"n":["Accumuler les enseignements sans passer à l’acte","Sentiment de progresser","Faux raisonnements, justifications sophistiquées","Effondrement à la première tempête","1 à 5 ans"],"i":"« Je suis encore en train d’étudier le sujet. » La sur-formation sans mise en pratique est la paresse préférée des gens intelligents."},"6.5":{"p":"Toutes les choses ne s’ajoutent pas à la discipline : elles s’ajoutent à la priorité. Mets le Royaume en première place de ta journée.","q":"Que mets-tu en premier dans ton agenda et dans ton budget, concrètement ?","w":"Verrouiller dans l’agenda un premier créneau hebdomadaire pour l’essentiel.","e":"Remettre le Royaume au jour où les finances seront réglées. À la place : inverse l’ordre : d’abord le Royaume.","dl":"1 à 5 ans.","s":["Placer le Royaume en premier dans l’agenda et le budget","Moins de dispersion, décisions plus simples","Inquiétude qui baisse, focus qui se concentre","Provision ajoutée par surcroît, impact durable","3 à 12 mois"],"n":["Chercher d’abord les provisions, servir deux maîtres","Agenda plein, priorités floues","Dilution des talents, engagements contradictoires","Médiocrité, inquiétude permanente","1 à 5 ans"],"i":"« Je remettrai le Royaume en priorité quand les finances seront réglées. » C’est inverser la clause : la provision est la conséquence, pas le préalable. Attendre « toutes ces choses »"},"6.6":{"p":"Entre la semence et la moisson, il y a une saison — et c’est là que la majorité abandonne, à quelques jours de la récolte.","q":"Combien de projets abandonnés étaient à plus de la moitié du chemin ?","w":"Écrire la date butoir réaliste de ta semence actuelle et la mettre à l’agenda.","e":"Abandonner après trois mois alors que la saison est plus longue. À la place : fixe un horizon de 12 à 24 mois.","dl":"immédiat à 1 an.","s":["Tenir la semence en terre après que l’émotion du départ est passée ; travailler sans feedback","Progrès microscopiques mais cumulatifs","Caractère consolidé, fiabilité éprouvée","« Nous moissonnerons au temps convenable, si nous ne nous relâchons pas » (Galates 6:9)","le cycle propre de chaque semence"],"n":["Déterrer la semence pour vérifier, changer de champ chaque saison","Résultats initiaux puis dispersion","Habitude de l’inachevé, méfiance en soi","La moisson d’autrui, vue de loin","immédiat à 1 an"],"i":"« Ça fait trois mois que je sème, ça ne marche pas. » Trois mois ne sont pas une saison de moisson — c’est le début de la germination. Le « ça ne marche pas » prématuré a tué plus de destinées que tous les échecs réels réunis."},"6.7":{"p":"Ce à quoi nous refusons de renoncer devient la limite ultime de notre expansion spirituelle et matérielle.","q":"Y a-t-il quelque chose que je protège au point que cela limite déjà ce que je peux devenir ?","w":"Identifier un attachement (temps, argent, reconnaissance) et le confier explicitement.","e":"Offrir ce qui ne coûte rien. À la place : le coût est la signature de la sincérité.","dl":"1 à 5 ans.","s":["Offrande volontaire d’un bien, d’un droit ou d’un confort","Libération d’espace et d’énergie","Détachement intérieur et confiance accrue","Multiplication et élargissement de l’influence","3 mois à plusieurs années"],"n":["Protection systématique de tous les acquis","Stagnation et frustration progressive","Idolâtrie des dons reçus","Plafond invisible et perte de sens","1 à 5 ans"],"i":"« Je donnerai quand j’aurai plus. » C’est exactement le raisonnement qui empêche le plus. Abraham n’a pas offert un fils de rechange ; il a offert l’unique. Le sacrifice qui attend l’abondance n’arrive presque jamais."},"7.1":{"p":"La sagesse commence quand je cesse de me croire l’unique auteur de mon chemin.","q":"Quand ai-je demandé à Dieu et à un sage avant une décision importante, pour la dernière fois ?","w":"Demander l’avis d’une personne plus expérimentée avant un choix important.","e":"Prendre la crainte de Dieu pour une peur servile. À la place : c’est un respect qui oriente.","dl":"","s":[],"n":[],"i":"« Dieu m’a dit de ne rien planifier. » Non : la sagesse prépare et confie. Jacques 4:13-15 ne condamne pas les projets, il condamne l’arrogance qui oublie « si le Seigneur le veut »."},"7.2":{"p":"Ce que je cache me retient ; ce que j’avoue me libère.","q":"Y a-t-il une faute que je repousse, que je justifie ou que je cache ?","w":"Aller vers la personne lésée : demander pardon et proposer de réparer.","e":"Cacher sa faute en espérant qu’elle disparaisse. À la place : l’aveu ouvre la porte.","dl":"","s":[],"n":[],"i":"« Dieu sait déjà, pas besoin de le dire. » Il sait, mais c’est l’aveu qui change mon cœur : la loi ne vise pas l’information de Dieu, elle vise ma vérité."},"7.3":{"p":"Ce que je fais au plus petit, je le fais à Celui qui me regarde.","q":"Quelle part concrète de mon temps ou de mon argent va à quelqu’un qui ne peut pas me rendre ?","w":"Choisir une cause ou une personne et lui consacrer une heure.","e":"Donner de loin sans jamais approcher les pauvres. À la place : sois présent, pas seulement donateur.","dl":"","s":[],"n":[],"i":"« Ils n’ont qu’à travailler comme moi. » Le travail enrichit (1.1), mais beaucoup de pauvretés viennent de l’injustice, de la maladie ou des circonstances. La loi ne demande pas de juger : elle demande de secourir."},"7.4":{"p":"Le contentement est une richesse que l’argent ne peut ni acheter ni remplacer.","q":"Quel montant ou quel objet me ferait dire : « maintenant, c’est assez » ? Si je l’ignore, la course n’a pas de ligne d’arrivée.","w":"Passer sept jours sans achat non nécessaire.","e":"Confondre contentement et passivité. À la place : on peut être content et ambitieux.","dl":"","s":[],"n":[],"i":"« Le contentement, c’est de la paresse. » Non : il n’interdit pas de progresser, il interdit de dépendre du prochain palier pour être heureux."},"7.5":{"p":"On ne reconnaît pas un disciple à ses idées, mais à son amour.","q":"À qui ai-je refusé mon temps, mon écoute ou mon pardon cette semaine ?","w":"Écouter une personne difficile sans l’interrompre.","e":"Aimer en théorie en évitant les personnes concrètes. À la place : aime par un acte précis.","dl":"","s":[],"n":[],"i":"« J’aime tout le monde en général. » L’amour abstrait coûte peu ; l’amour du prochain a un nom et une adresse."}};
