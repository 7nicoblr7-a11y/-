  h+='<details class="c2"><summary><b>⏰ Quand appliquer quelles lois ?</b></summary>'+R.map(r=>`<p style="margin:8px 0"><b>${r[0]} :</b><br>`+r[1].split(" ").map(chip).join("")+"</p>").join("")+"</details>";
  h+='<details class="c2"><summary><b>🗓️ Programme de démarrage sur 30 jours</b></summary>'+P30.map(r=>`<p style="margin:8px 0"><b>${r[0]}</b><br>`+r[1].split(" ").map(chip).join("")+"</p>").join("")+"</details>";
  const v4e=$("#v4"),sct=v4e.scrollTop,opn=[...document.querySelectorAll("#td details")].map(x=>x.open);$("#td").innerHTML=h;document.querySelectorAll("#td details").forEach((x,k)=>{if(opn[k])x.open=true});v4e.scrollTop=sct}
/* ===== SAUVEGARDE ===== */
const payload=()=>{ex.lastBackup=ld();saveX();const e=$("#lbk");if(e)e.textContent=bkTxt();return JSON.stringify({v:3,pg,ex,date:new Date().toISOString()},null,2)};
function restore(txt){try{const d=JSON.parse(txt);if(!d||typeof d!=="object"||(!d.pg&&!d.ex))throw 0;if(d.pg)pg=cleanPg(d.pg);if(d.ex)ex=cleanEx(d.ex);else ex.rated=null;fixRated();saveP();saveX();soft();toast("Sauvegarde restaurée")}catch(e){toast("Fichier ou texte invalide")}}
function svTab(){
  $("#sv").innerHTML=`<div class="c2"><div class="k" style="margin-top:0">SAUVEGARDE DE TA PROGRESSION</div><p class="sub">Tes niveaux sont enregistrés uniquement sur cet appareil et ce navigateur. Garde une copie pour ne rien perdre.</p><p class="sub" id="lbk">${bkTxt()}</p><p class="sub">Sur iPhone, une app ajoutée à l’écran d’accueil a son propre stockage, séparé de Safari : exporte avant de l’ajouter, puis restaure.</p><button class="ch" id="xe">⬇️ Télécharger (.json)</button>${navigator.share?'<button class="ch" id="xs">📤 Partager</button>':""}<button class="ch" id="xc">📋 Copier le code</button></div>
  <div class="c2"><div class="k" style="margin-top:0">RESTAURER</div><label class="ch" style="cursor:pointer">⬆️ Importer un fichier<input type="file" id="xf" accept=".json,application/json" class="sr"></label><p class="sub" style="margin:8px 0 6px">ou colle ici le code copié :</p><textarea id="xt" aria-label="Code de sauvegarde à restaurer" placeholder="{ … }"></textarea><button class="ch" id="xr">Restaurer</button></div>
  <div class="c2"><div class="k" style="margin-top:0">REMISE À ZÉRO</div><p class="sub">Efface tous tes niveaux et ton historique sur cet appareil.</p><button class="ch" id="xz">🗑️ Tout effacer</button></div>`;
  $("#xe").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([payload()],{type:"application/json"}));a.download="51-lois-sauvegarde.json";a.click()};
  const xs=$("#xs");if(xs)xs.onclick=()=>navigator.share({title:"51 lois – sauvegarde",text:payload()}).catch(()=>{});
  $("#xc").onclick=()=>{const t=payload();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Code copié")).catch(()=>{const a=$("#xt");a.value=t;a.select();toast("Copie le texte affiché")})};
  $("#xf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(f)};
  $("#xr").onclick=()=>restore($("#xt").value);
  $("#xz").onclick=()=>{if(confirm("Effacer tous tes niveaux et ton historique ?")){pg={};ex=cleanEx(null);fixRated();saveP();saveX();soft();toast("Données effacées")}}}
/* ===== RÈGLES ===== */
function rules(){$("#rb").innerHTML=`<div class="rc"><h3>1. Le principe : Semence → Moisson (loi 6.1)</h3><p>Toutes les lois reposent sur une règle mère : <b>tu récoltes ce que tu sèmes, en plus grand, après une saison</b>. Chaque loi est une semence concrète dans un domaine précis de ta vie.</p></div>
<div class="rc"><h3>2. Les 5 domaines et leurs sous-parties</h3><ul>${D.map((d,k)=>`<li><b style="color:${CT[k]}">● ${d[1]}</b> (${dIds(k).length} lois)<br><small>${SP[k].map(s=>s[0]).join(" · ")}</small></li>`).join("")}</ul></div>
<div class="rc"><h3>3. Noter ton niveau (0 à 100 %)</h3><ul><li><b>0 %</b> : pas encore commencé</li><li><b>25 %</b> : premiers pas</li><li><b>50 %</b> : en chemin, pratique fragile</li><li><b>75 %</b> : bien installé</li><li><b>100 %</b> : ancré, réflexe naturel</li></ul><p>Tes lois les moins avancées alimentent la <b>loi du jour</b> et tes <b>3 priorités</b>.</p></div>
<div class="rc"><h3>4. Les onglets</h3><ul><li><b>Lois</b> : liste avec recherche, domaines et sous-parties.</li><li><b>Carte</b> : vue d’ensemble ; touche un domaine ou une sous-partie pour zoomer, zoome pour lire les noms.</li><li><b>Aujourd’hui</b> : loi du jour, priorités, roue de vie, cycle de 51 semaines.</li><li><b>Sauvegarde</b> : export, import et remise à zéro.</li></ul></div>
<div class="rc"><h3>5. À savoir</h3><p>Les conseils sur le corps, l’alimentation, le jeûne et l’argent sont des repères généraux, pas un avis médical ou financier. Pour une situation précise, demande l’avis d’un professionnel.</p><p>Les effets et les délais indiqués sont des ordres de grandeur issus d’une lecture spirituelle, pas des garanties.</p><p>🔥 La série compte les jours consécutifs avec au moins une action cochée. Un jour isolé manqué ne la casse pas, deux jours de suite oui.</p><p>Les priorités viennent de tes lois les moins avancées (0 % compris). La loi du jour reste la même toute la journée.</p><p>💰 signale la déclinaison financière d’une loi.</p></div>`}
/* ===== NAVIGATION ===== */
function tab(n){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===n));["1","2","4","5"].forEach(j=>$("#v"+j).classList.toggle("hide",j!==n));if(n==="2")setV()}
function soft(){renderList();dom(cd);draw();today();svTab();gp();if(sel)card()}
$("#q").addEventListener("input",renderList);
function openL(){if(!hOpen){hOpen=true;try{history.pushState({l:1},"")}catch(e){hOpen=false}}}
function openFiche(i){if(!sel&&!$("#rm").classList.contains("open"))lastF=document.activeElement;sel=i;card();draw();openL();const b=$("#card .bd");if(b)b.scrollTop=0;const x=$("#card .cx");if(x)x.focus()}
function openRules(){lastF=document.activeElement;$("#rm").classList.add("open");openL();$("#cr").focus()}
function hideL(){if(sel)foc=sel;sel=null;card();draw();$("#rm").classList.remove("open");const f=lastF;lastF=null;if(f&&f.focus&&document.contains(f)){try{f.focus({preventScroll:true})}catch(e){}}}
function closeL(){hideL();if(hOpen){hOpen=false;try{history.back()}catch(e){}}}
addEventListener("popstate",()=>{if(hOpen){hOpen=false;hideL()}});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if((e.key==="Enter"||e.key===" ")&&t&&t.getAttribute&&t.getAttribute("role")==="button"){e.preventDefault();t.dispatchEvent(new MouseEvent("click",{bubbles:true}));return}
  const ov=sel?$("#card"):$("#rm").classList.contains("open")?$("#rm"):null;
  if(!ov)return;
  if(e.key==="Escape"){e.preventDefault();closeL();return}
  if(e.key==="Tab"){const f=[...ov.querySelectorAll('button,input,textarea,summary,[role="button"]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1],cur=document.activeElement;
    if(!ov.contains(cur)){e.preventDefault();(e.shiftKey?z:a).focus()}else if(e.shiftKey&&cur===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&cur===z){e.preventDefault();a.focus()}}
});
$("#br").onclick=openRules;$("#cr").onclick=closeL;
const TC={light:"#faf8f4",dark:"#16130f"};
const curTheme=()=>document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
const setTC=n=>document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{m.removeAttribute("media");m.setAttribute("content",TC[n])});
$("#bt").onclick=()=>{const n=curTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);setTC(n);try{localStorage.setItem("lois51theme",n)}catch(e){}};
try{const th=localStorage.getItem("lois51theme");if(th==="dark"||th==="light")setTC(th)}catch(e){}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t],[data-d],[data-ld],[data-ls],[data-gd],[data-sd],[data-i],[data-k],[data-w],[data-x],[data-z],[data-r],[data-lv],[data-qs]");
  if(mv){mv=0;return}if(!t)return;const d=t.dataset;
  if(d.t)tab(d.t);
  else if(d.x)closeL()
  else if(d.lv!==undefined&&sel)setLevel(sel,+d.lv,true);
  else if(d.ld!==undefined){listDom=+d.ld;listSub=-1;renderList()}
  else if(d.ls!==undefined){listSub=+d.ls;renderList()}
  else if(d.gd!==undefined){listDom=+d.gd;listSub=-1;tab("1");renderList();$("#v1").scrollTop=0}
  else if(d.qs){D.forEach((_,k)=>{const v=num($("#qs"+k).value);dIds(k).forEach(i=>{if(pg[i]===undefined)pg[i]=v})});saveP();soft();toast("Point de départ enregistré")}
  else if(d.k)tog(d.k);
  else if(d.r){const a=(ex.daily&&ex.daily.date===ld()?ex.daily.alt:0)+1;ex.daily={date:ld(),id:pick(a),alt:a};saveX();today()}
  else if(d.w){if(d.w==="start"){ex.start=ld(mon(new Date()));ex.off=0}else if(d.w==="stop"){ex.start=null;ex.off=0}else ex.off=(ex.off||0)+(+d.w);saveX();today()}
  else if(d.sd){const[a,b]=d.sd.split(".").map(Number);zs(a,b)}
  else if(d.d!==undefined)zd(+d.d);
  else if(d.z){foc=null;go(550,550,fitW());dom(-1);draw()}
  else if(d.i)openFiche(d.i)});
/* ===== ZOOM / DÉPLACEMENT ===== */
const mw=$("#mw"),svg=$("#m"),Pt=new Map();let V=null,mv=0,dist=0,pd=0;
const fitW=()=>780*Math.max(1,mw.clientWidth/(mw.clientHeight||1));
function setV(){const W=mw.clientWidth,Q=mw.clientHeight;if(!W||!Q)return;if(!V)V={x:550,y:550,w:fitW()};const h=V.w*Q/W;svg.setAttribute("viewBox",`${V.x-V.w/2} ${V.y-h/2} ${V.w} ${h}`);svg.classList.toggle("far",V.w>760)}
function go(x,y,w){const a={...V},t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/240),e=1-Math.pow(1-k,3);V={x:a.x+(x-a.x)*e,y:a.y+(y-a.y)*e,w:a.w+(w-a.w)*e};setV();if(k<1)requestAnimationFrame(f)})(t0)}
function zd(d){dom(d);draw();const ids=dIds(d).filter(i=>i!=="6.1"),a=ids.reduce((t,i)=>t+A[i],0)/ids.length,c=P(a,280);go(c[0],c[1],560)}
function zs(d,j){dom(d);draw();const ids=SP[d][j][1].split(" ").filter(i=>i!=="6.1"),a=ids.reduce((t,i)=>t+A[i],0)/ids.length,c=P(a,300);go(c[0],c[1],420)}
$("#zi").onclick=()=>{if(V)go(V.x,V.y,Math.max(320,V.w*.72))};$("#zo").onclick=()=>{if(V)go(V.x,V.y,Math.min(fitW()*1.2,V.w*1.35))};$("#zr").onclick=()=>{go(550,550,fitW());dom(-1);draw()};
const mid=()=>{let x=0,y=0;Pt.forEach(p=>{x+=p[0];y+=p[1]});return[x/Pt.size,y/Pt.size]};
const pd2=()=>{const a=[...Pt.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1};
document.addEventListener("pointerdown",e=>{if(!Pt.size){mv=0;dist=0}if(mw.contains(e.target)){Pt.set(e.pointerId,[e.clientX,e.clientY]);if(Pt.size>1)pd=pd2()}});
const up=e=>{Pt.delete(e.pointerId);if(Pt.size>1)pd=pd2()};document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
mw.addEventListener("pointermove",e=>{const o=Pt.get(e.pointerId);if(!o||!V)return;const r=mw.getBoundingClientRect(),W=r.width,Q=r.height,om=mid(),n=[e.clientX,e.clientY];dist+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1]);Pt.set(e.pointerId,n);if(dist>8)mv=1;if(!mv)return;
  const nm=mid(),s=V.w/W,px=V.x+(om[0]-r.left-W/2)*s,py=V.y+(om[1]-r.top-Q/2)*s;if(Pt.size>1){const d=pd2();V.w=Math.min(fitW()*1.2,Math.max(300,V.w*pd/d));pd=d}
  const s2=V.w/W;V.x=px-(nm[0]-r.left-W/2)*s2;V.y=py-(nm[1]-r.top-Q/2)*s2;setV()});
mw.addEventListener("wheel",e=>{e.preventDefault();if(!V)return;const r=mw.getBoundingClientRect(),W=r.width,Q=r.height,s=V.w/W,px=V.x+(e.clientX-r.left-W/2)*s,py=V.y+(e.clientY-r.top-Q/2)*s;V.w=Math.min(fitW()*1.2,Math.max(300,V.w*Math.exp(e.deltaY/400)));const s2=V.w/W;V.x=px-(e.clientX-r.left-W/2)*s2;V.y=py-(e.clientY-r.top-Q/2)*s2;setV()},{passive:false});
new ResizeObserver(setV).observe(mw);
rules();soft();tab("1");
try{if(!localStorage.getItem("lois51_seen_rules")){openRules();localStorage.setItem("lois51_seen_rules","1")}}catch(e){}
