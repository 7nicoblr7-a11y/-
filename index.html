<style>
:root{--bg:#faf8f4;--fg:#1c1915;--mu:#5f584e;--cd:#fff;--bd:#dfd8ca;--sh:0 6px 20px rgba(0,0,0,.08);--t0:#2a7f55;--t1:#c23d68;--t2:#9a6208;--t3:#3567c0;--t4:#b84d22;--up:#23804a;--dn:#c23a32;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120e;--fg:#f3ede2;--mu:#b0a797;--cd:#211d17;--bd:#393228;--sh:0 8px 24px rgba(0,0,0,.35);--t0:#5cc28e;--t1:#ee7fa3;--t2:#e2a64a;--t3:#80a8f2;--t4:#f0906a;--up:#4cc38a;--dn:#f0837b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15120e;--fg:#f3ede2;--mu:#b0a797;--cd:#211d17;--bd:#393228;--sh:0 8px 24px rgba(0,0,0,.35);--t0:#5cc28e;--t1:#ee7fa3;--t2:#e2a64a;--t3:#80a8f2;--t4:#f0906a;--up:#4cc38a;--dn:#f0837b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{position:relative;display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--bg)}
#top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--bd);background:var(--cd)}
#top b{font-size:1.1rem;white-space:nowrap}
.ta{margin-left:auto;display:flex;align-items:center;gap:6px}
.ib{font:inherit;font-size:.82rem;font-weight:700;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 10px;cursor:pointer;white-space:nowrap}
#gp{font-size:.8rem;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--fg);color:var(--bg)}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--cd);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{font:inherit;font-size:.78rem;font-weight:700;border:0;border-radius:10px;padding:9px 2px;background:none;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs .ic{font-size:1.05rem;line-height:1}.tabs button.on{background:var(--fg);color:var(--bg)}
.pn{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 28px}.hide{display:none!important}
.sub{color:var(--mu);font-size:.9rem;margin:0 0 10px}
.k{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px;font-weight:800}
.sw{position:sticky;top:-12px;z-index:10;background:var(--bg);padding:12px 0 8px;margin-top:-12px}
#q{width:100%;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--fg)}
.dg{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;margin-top:8px;padding-bottom:2px;scrollbar-width:none}.dg::-webkit-scrollbar{display:none}.dg .pl{flex:none}#ls:empty{display:none}
.pl{font:inherit;font-size:.82rem;font-weight:700;padding:6px 11px;border-radius:999px;border:1.5px solid var(--bd);background:var(--cd);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.pl.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}.pl.s{font-size:.78rem;padding:7px 11px}
.li{width:100%;text-align:left;font:inherit;background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:14px;padding:12px 14px;margin-bottom:9px;cursor:pointer;display:block;box-shadow:var(--sh)}
.lt{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.lb{font-size:.78rem;font-weight:800;color:var(--at)}
.lv{font-size:.76rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--bd)}
.li h3{font-size:1.05rem;margin:0 0 4px}.li p{font-size:.92rem;color:var(--mu);margin:0;line-height:1.4}
.bar{height:5px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac)}
.sh{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
#v2{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.mb{flex:none;display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;background:var(--cd);border-bottom:1px solid var(--bd)}
.mb button{font:inherit;font-size:.78rem;font-weight:700;padding:5px 9px;border-radius:999px;border:1.5px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer}
.mb button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#mw{flex:1;min-height:0;touch-action:none;overflow:hidden;position:relative}
svg#m{width:100%;height:100%;display:block}svg text{font-family:inherit;pointer-events:none}svg g{cursor:pointer}
svg.far .nm{display:none}svg text.sdl{pointer-events:auto;cursor:pointer}
.mc{position:absolute;left:10px;bottom:46px;z-index:20;display:flex;gap:6px}
.mc button{font:inherit;font-weight:800;min-width:38px;height:38px;padding:0 10px;border-radius:999px;border:1px solid var(--bd);background:var(--cd);color:var(--fg);box-shadow:var(--sh);cursor:pointer}
#mh{flex:none;padding:6px 12px;font-size:.8rem;color:var(--mu);background:var(--cd);border-top:1px solid var(--bd);text-align:center}
#card{display:none}
#card.open{display:flex;flex-direction:column;position:fixed;inset:0;z-index:60;max-width:560px;margin:0 auto;background:var(--cd);animation:up .2s ease}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.hd{position:relative;flex:none;overflow:hidden;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
.hd .bg{position:absolute;right:8px;bottom:-18px;font-size:5.5rem;font-weight:900;opacity:.16;line-height:1;pointer-events:none}
.dmn{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.95;padding-right:40px}
.hd h2{margin:4px 40px 4px 0;font-size:1.45rem;line-height:1.2}.mt{font-style:italic;opacity:.95;margin:2px 0 10px;font-size:.95rem}
.cx{position:absolute;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.32);color:#fff;font-size:1.1rem;font-weight:800;cursor:pointer}
.lvb{background:rgba(0,0,0,.24);border-radius:14px;padding:10px 12px;margin-top:8px}
.lvr{display:flex;justify-content:space-between;font-size:.85rem;font-weight:800;margin-bottom:6px}
.lvs{width:100%;accent-color:#fff;height:28px;cursor:pointer}
.lvp{display:flex;gap:4px;margin-top:4px}.lvp button{flex:1;font:inherit;font-size:.74rem;font-weight:800;padding:5px 2px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.lvp button.on{background:#fff;color:#1c1915}
.bd{flex:1;min-height:0;overflow-y:auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom,0px))}
.cd{border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--bg)}.cd p{margin:4px 0}
.ct{font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:4px}
.act{border-width:2px}.mp1{font-size:1.04rem;font-weight:700}.ou{margin:8px 0 0!important;font-size:.95rem}
.big{width:100%;font:inherit;font-size:1rem;font-weight:800;border:2px solid var(--ac);background:var(--cd);color:var(--at);border-radius:12px;padding:11px 16px;margin-top:10px;cursor:pointer}.big.on{background:var(--ac);color:#fff}
.two{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}.two .cd{margin:0}

const X={"1.1":{"q":"Mon quotidien est-il dirigé par la discipline ou par l’humeur du moment ?","s":["Planification rigoureuse et passage à l’acte sans délai","Production constante de travail de haute valeur","Consolidation des réseaux neuronaux de la discipline","Indépendance financière et reconnaissance socioprofessionnelle","6 mois à 3 ans"],"n":["Procrastination, hésitation et travail bâclé","Accumulation de retards et dettes opérationnelles","Ruminations anxieuses et perte de confiance en soi","Dépendance économique et marginalisation","1 à 6 mois"],"i":"« J’attends que Dieu ouvre une porte. » Non : la porte s’ouvre à celui qui frappe — et frapper, c’est travailler. Confondre la vision avec l’action est la forme la plus respectable de la paresse."},"1.2":{"q":"Ressens-tu une contraction interne lorsque tu dois donner ou payer de justes rémunérations ?","s":["Don régulier et désintéressé d’une part de ses ressources","Ouverture d’opportunités et soutien inattendu en crise","Libération du stress d’attachement matériel","Abondance durable et protection sociale","3 à 18 mois"],"n":["Rétention angoissée et avarice dans les transactions","Isolement économique et méfiance des tiers","Anxiété de perte et hypervigilance financière","Appauvrissement relationnel et perte matérielle inattendue","6 à 24 mois"],"i":"« Je donnerai quand je serai riche. » C’est inverser la cause et l’effet : on ne devient pas riche puis généreux ; la loi déclare que la générosité précède l’enrichissement."},"1.3":{"q":"Le don passe-t-il avant les dépenses, ou après, quand il reste quelque chose ?","s":["Prélever la première part dès l’entrée du revenu","Budget plus clair : les dépenses s’ajustent au reste","Discipline de l’ordre, moins de fuites financières","Libéralité durable et confiance dans la provision","3 à 12 mois"],"n":["Ne donner que ce qui reste en fin de mois","Jamais de reste : le don est sans cesse repoussé","Habitude de rétention, anxiété financière de fond","Générosité jamais pratiquée, sentiment de manque persistant","1 à 5 ans"],"i":"« Je donnerai quand j’aurai assez. » La dîme ne se calcule pas sur le confort mais sur le revenu — 10 % de 1 000 restent plus faciles que 10 % de 10 000."},"1.4":{"q":"Combien de projets commencés ces deux dernières années ont été abandonnés en cours de route ?","s":["Chiffrage prévisionnel et étude des risques","Maîtrise des délais et fin des projets entrepris","Sérénité décisionnelle","Réussite structurelle et crédibilité solide","Durée totale du projet"],"n":["Lancement d’initiatives sur impulsion sans budget réaliste","Épuisement financier et projets abandonnés","Frustration et perte du sens de l’organisation","Ruine des ressources et réputation de volatilité","1 à 6 mois"],"i":"« Je fais confiance à Dieu, je ne budgète pas. » Faux : la foi n’a jamais dispensé du calcul — Jésus en fait l’illustration même du coût de l’engagement. Confondre foi et improvisation, c’est baptiser le désordre."},"1.5":{"q":"Laisses-tu des petites tâches inaccomplies sous prétexte qu’elles sont mineures ?","s":["Traitement rigoureux des détails insignifiants en apparence","Absences d’erreurs majeures et fluidité du service","Renforcement des structures de vigilance","Élévation naturelle vers des responsabilités supérieures","1 à 2 ans"],"n":["Tolérance face aux petits compromis et aux négligences","Erreurs en chaîne et fuite des ressources","Dégradation progressive de l’éthique personnelle","Déclassement et perte de confiance générale","3 à 12 mois"],"i":"« J’attends le bon moment, le signe, la confirmation. » Le serviteur à un talent attendait lui aussi — par peur. L’Écriture nomme cette attente : paresse déguisée en prudence. Le « moment parfait » n’existe pas : on le fabrique en commençant."},"1.6":{"q":"Une part significative de tes revenus mensuels sert-elle à rembourser des consommations passées ?","s":["Refus du crédit de consommation et désendettement méthodique","Croissance des fonds propres et maîtrise du budget","Restauration du sentiment de liberté et de paix","Souveraineté financière et capacité d’investissement","1 à 5 ans"],"n":["Recours systématique à l’emprunt pour financer le niveau de vie","Cumul des intérêts passifs et précarité budgétaire","Anxiété de défaut et perte progressive d’options de vie","Insolvabilité et perte de patrimoine","1 à 3 ans"],"i":"« Dieu va me sortir de cette dette » — tout en signant le crédit suivant. Prier pour la libération financière en continuant d’alimenter la machine à intérêts, c’est demander la sortie de prison tout en prolongeant soi-même sa peine."},"2.1":{"q":"Parviens-tu à déconnecter complètement ton esprit des affaires une journée entière par semaine ?","s":["Arrêt total du travail un jour par semaine","Vitalité renouvelée et créativité décuplée","Régularisation des rythmes endocriniens","Longévité et productivité soutenue sur des décennies","Immédiat à 1 mois"],"n":["Travail continu 7 jours sur 7","Baisse de rendement, erreurs critiques et irritabilité","Épuisement des surrénales et inflammation tardive","Effondrement physique ou psychologique forcé","3 à 12 mois"],"i":"« Je suis trop occupé par l’œuvre de Dieu pour me reposer. » Le burn-out n’est pas un martyre spirituel : c’est une violation du commandement n°4."},"2.2":{"q":"Passes-tu plus de 8 heures par jour assis sans interrompre cette position par de l’exercice ?","s":["Marche rapide ou exercice soutenu quotidien","Amélioration du tonus, meilleure posture","Neurogenèse et optimisation du profil lipidique","Autonomie physique durable et résistance à l’effort","2 semaines à 3 mois"],"n":["Sédentarité prolongée et absence d’effort physique","Atrophie musculaire, douleurs de dos, essoufflement","Perte de densité osseuse et ralentissement métabolique","Vulnérabilité physique et dépendance précoce","6 mois à 3 ans"],"i":"« Mon corps ne compte pas, seul l’esprit compte. » Faux dualisme : Paul déclare le corps « temple », pas ruine négligeable."},"2.3":{"q":"Utilises-tu la nourriture ou des substances comme compensations émotionnelles ?","s":["Alimentation modérée, sans toxiques ni excès","Poids de santé, énergie constante et teint sain","Réduction des marqueurs inflammatoires (CRP bas)","Longévité, absence de maladies métaboliques","1 à 6 mois"],"n":["Suralimentation, produits ultra-transformés, abus de stimulants","Prise de poids, léthargie post-repas et fatigue","Résistance à l’insuline et stéatose hépatique","Pathologies chroniques et déclin prématuré","2 à 10 ans"],"i":"« J’ai la liberté en Christ, tout m’est permis. » Paul répond lui-même au verset suivant : « tout m’est permis, mais tout n’est pas utile » (1 Corinthiens 6:12)."},"2.4":{"q":"Te couches-tu à des heures différentes chaque soir ?","s":["Heure de coucher fixe, 7-8 h de sommeil","Réveil plus facile, humeur stable","Mémoire consolidée, cortisol régulé","Performance durable et cœur préservé","Immédiat à 2 semaines"],"n":["Veilles répétées, écrans au lit","Fatigue, irritabilité, café en cascade","Attention et jugement dégradés","Erreurs coûteuses, usure cardiométabolique","1 semaine à 1 an"],"i":"« Les gens efficaces dorment peu. » Le Psaume 127:2 dit l’inverse : Dieu donne « pendant leur sommeil » à ses bien-aimés. Et la personne privée de sommeil est la dernière à voir sa propre baisse de performance."},"2.5":{"q":"Ta journée dépend-elle plus de la lumière artificielle que de la lumière du jour ?","s":["Lumière du jour dès le réveil, nuit sombre","Endormissement plus rapide, énergie régulière","Mélatonine et cortisol alignés","Santé métabolique et humeur stables","1 à 4 semaines"],"n":["Écrans tardifs, repas et nuits décalés","Réveils lourds, coups de fatigue","Mélatonine supprimée, horloge désynchronisée","Troubles métaboliques et du sommeil installés","6 mois à 5 ans"],"i":"« Je m’adapte à n’importe quel rythme. » Le Psaume 104:19 rappelle que la lune et le soleil marquent les temps : l’ordre est inscrit dans la création."},"2.6":{"q":"Y a-t-il une pièce où tu évites d’entrer ou de t’asseoir ?","s":["Aérer, nettoyer, désencombrer par petits gestes réguliers","Pièces plus claires, moins de recherches d’objets","Moins d’allergènes, charge mentale allégée","Clarté d’esprit et sérénité durables","Immédiat à 1 mois"],"n":["Laisser s’accumuler désordre et saleté","Pièces encombrées, temps perdu à chercher","Surcharge visuelle, fatigue d’attention","Confusion mentale, hôtes évités","3 mois à 2 ans"],"i":"« Le désordre, c’est ma créativité. » Parfois ; mais pour la plupart des gens, le désordre chronique n’est pas un choix créatif, c’est une dette d’attention qui s’accumule en silence."},"2.7":{"q":"Mes soucis du jour sont-ils traités par l’action ou par la rumination ?","s":["Concentration sur l’action présente et ancrage dans la confiance : chaque souci est confié, puis la tâche du moment reprend","Moins de rumination, attention revenue sur ce qui est faisable aujourd’hui","Réduction du cortisol, baisse de la tension de fond, sommeil plus facile à trouver","Lucidité dans les décisions, paix stable, énergie préservée","1 à 4 semaines"],"n":["Projection catastrophiste constante, souci repris après avoir été confié","Fatigue mentale, décisions repoussées, irritabilité","Surcharge du système de stress, sommeil haché, fatigabilité","Épuisement et paralysie","2 à 12 mois"],"i":"« Je m’inquiète parce que je suis responsable. » Non : la responsabilité agit, l’inquiétude tourne en rond. Si le problème a une action possible → fais-la (Loi 1.1). S’il n’en a pas → décharge-le (1 Pierre 5:7)."},"2.8":{"q":"Qu’est-ce qui décide à ma place : mes impulsions ou mes décisions ?","s":["Poser des murs avant l’assaut : délais, blocages, limites écrites, maîtrise des impulsions et fidélité","Réactions mesurées ; moins de messages, d’achats et de colères regrettés","Intégrité émotionnelle, profondeur du lien, notamment dans le couple","Paix de la conscience et autorité sur soi-même","1 à 3 mois"],"n":["Laisser un accès libre à toute stimulation et réagir à chaud","Recherche de stimulations désordonnées, regrets répétés","Désensibilisation dopaminergique, honte et anxiété","Rupture des relations et dépendance","6 mois à 3 ans"],"i":"« Je suis fait comme ça, je suis quelqu’un de passionné. » La Bible classe cette phrase sous « ville sans muraille ». La passion est un moteur ; sans freins ni direction, elle détruit ce qu’elle prétend servir."},"2.9":{"q":"Quelle est la première chose que tu regardes ou que tu fais chaque matin ?","s":["Réserver la première heure à l’alignement, sans écran","Matin calme, priorités claires","Moins de réactivité, décisions plus nettes","Journées ordonnées qui se composent en destinée","2 à 6 semaines"],"n":["Ouvrir la journée par les notifications et les urgences d’autrui","Matinée dispersée, retard sur l’essentiel","Pilotage par la demande des autres","Années passées à réagir, objectifs reportés","6 mois à plusieurs années"],"i":"« Je suis du soir, Dieu me connaît. » La question n’est pas la chronobiologie mais la séquence : quelle que soit l’heure du lever, la première heure définit l’ordre du jour — ou le désordre."},"3.1":{"q":"Mon entourage me tire-t-il vers le haut ou vers le bas ?","s":["Choisir ses fréquentations avec soin et s’entourer de personnes qui élèvent","Entourage rigoureux : conversations, standards et habitudes tirent vers le haut","Alignement progressif sur les normes, le langage et les ambitions du groupe","Évolution personnelle rapide","6 mois à 3 ans"],"n":["Fréquenter durablement des personnes cyniques ou toxiques","Plaintes, moqueries et excuses deviennent le fond sonore","Normalisation de la médiocrité","Chute morale et sociale","1 à 5 ans"],"i":"« Je reste avec eux pour les influencer. » La loi ne connaît pas le sens du flux : la contagion suit la fréquence et l’intensité, pas les intentions."},"3.2":{"q":"Conserves-tu de la rancune ou de la colère dès que le nom d’une personne en particulier est évoqué ?","s":["Abandon explicite du désir de vengeance ou de punition","Diminution de la tension relationnelle","Libération des charges émotionnelles négatives","Paix intérieure, rétablissement de la santé physique et liberté","Immédiat à quelques semaines"],"n":["Entretien de l’amertume et de la rancœur","Agressivité réactive et isolement progressif","Ruminations et inflammation systémique chronique","Empoisonnement de soi-même et destruction des relations","Continu et cumulatif"],"i":"« Je pardonnerai quand il reconnaîtra ses torts. » La loi ne conditionne pas le pardon à la repentance de l’autre — sinon ton cœur reste otage de l’attitude d’un autre."},"3.3":{"q":"Y a-t-il une personne avec qui un différend dure depuis plus d’un jour ?","s":["Aborder le différend le jour même, en privé, avec douceur","Tension qui retombe, explication entendue","Pas de coalitions ni de versions parallèles","Relation préservée, plus solide après l’épreuve","immédiat à quelques jours"],"n":["Se taire, bouder ou en parler à d’autres","Climat froid, évitement","Interprétations qui grossissent, alliances défensives","Amertume installée, relation rompue","quelques semaines à plusieurs années"],"i":"« Je prie pour lui, ça ira mieux. » La loi n’ordonne pas de prier pour le frère mais d’aller vers le frère — « va » est un verbe de mouvement, pas de méditation. La prière sans déplacement est une fuite déguisée."},"3.4":{"q":"À qui as-tu rendu service cette semaine sans qu’on te le demande ?","s":["Rendre un service concret, discret, régulier","Sourires, reconnaissance, liens plus chaleureux","Confiance et dette morale positive","Réseau fidèle et influence naturelle","Quelques semaines à quelques années"],"n":["Exploiter les autres pour son profit","Gains rapides, relations froides","Méfiance générale, isolement","Perte de soutien au premier revers","6 mois à 5 ans"],"i":"« Je servirai quand j’aurai réussi. » Jésus n’attend pas la réussite : le service précède la grandeur, pas l’inverse. Et servir pour être aimé n’est pas du service, c’est un échange déguisé."},"3.5":{"q":"Quelle personne de ton entourage traites-tu mieux en face que dans son dos ?","s":["Respect et encouragements semés","Climat de confiance qui s’installe","Réciprocité qui revient sans qu’on la réclame","Entourage loyal et solidaire","Quelques semaines à 2 ans"],"n":["Mépris, critique en coulisse, médisance","Défiance, conversations qui se ferment","Réputation qui circule en mal","Rejet et trahison au moment de besoin","1 à 5 ans"],"i":"« Je dis ce que je pense, tant pis pour eux. » La franchise n’exige pas le mépris. Et ce que tu dis de l’absent, ton interlocuteur le sait capable de le dire de lui. Les paroles reviennent toujours."},"3.6":{"q":"Mon couple est-il traité comme une priorité ou comme un reste de temps ?","s":["Fidélité et investissement quotidien dans le couple","Sécurité affective et stabilité","Confiance qui se renforce, équipe soudée face aux épreuves","Héritage émotionnel solide","1 à 5 ans"],"n":["Infidélité, rupture de parole ou négligence du foyer","Distance, non-dits, conflits répétés","Traumatisme affectif et frais de rupture","Chaos familial durable","6 mois à 5 ans"],"i":"« Je me donne pour le ministère, le business, la mission — ma famille comprend. » Les lois disent le contraire : le foyer est le premier ministère."},"3.7":{"q":"Quand as-tu parlé à tes parents — ou à leur mémoire — avec respect et gratitude, sans attendre qu’ils changent ?","s":["Parler avec respect à ses parents, les visiter, les soutenir concrètement","Tensions familiales apaisées, liens renoués","Fin de la rumination de colère, identité plus stable","« Longueur de jours » : santé, descendance bénie, paix de famille","premiers effets en quelques mois ; plénitude sur une vie entière"],"n":["Mépris, silence ou ressentiment entretenu envers ses parents","Ruptures familiales, scènes devant les enfants","Colère chronique, schéma transmis à la génération suivante","Isolement en vieillissant, schéma répété par les enfants","1 à 10 ans"],"i":"« J’honore Dieu, pas les hommes. » Les lois disent l’inverse : on honore Dieu à travers les hommes qu’il a placés — parents, pasteurs, autorités, employeurs."},"3.8":{"q":"As-tu déjà dit à voix haute, à ton enfant ou à un plus jeune, quel principe guide ta famille ?","s":["Dire et écrire les principes de la famille ; confier des responsabilités réelles aux plus jeunes","Enfants et disciples qui raisonnent avec la boussole familiale","Continuité des valeurs, mémoire vivante de la famille","Patrimoine — biens et caractère — préservé sur trois générations","10 à 30 ans"],"n":["Transférer l’argent sans les principes, garder le silence sur l’histoire familiale","Héritiers désarmés face au patrimoine","Dispersion, conflits de succession","Le fruit du travail passe à d’autres (cf. Proverbes 5:10)","1 à 2 générations"],"i":"« L’école, l’église ou Internet s’en chargeront. » La délégation totale est une démission : la loi assigne la transmission aux parents, dans la maison, quotidiennement."},"4.1":{"q":"Y a-t-il une obligation administrative, fiscale ou légale que tu reportes ?","s":["Se mettre en règle sur les obligations légales","Sécurité juridique, moins de stress administratif","Crédibilité et paix avec l’entourage","Liberté réelle, protégée par l’ordre","Immédiat"],"n":["Fraude, contournement, rébellion de principe","Gains rapides, tensions avec l’administration","Risque de sanction, réputation entamée","Condamnation et perte de liberté","Quelques mois à plusieurs années"],"i":"« La règle est injuste, donc je peux l’ignorer. » Il existe des lois à contester, mais par les voies légitimes. Le contournement privé ne réforme rien : il entretient seulement la défiance. Et « tout le monde le fait » ne change rien à ce que la loi demande."},"4.2":{"q":"Quelle décision récente as-tu prise sans consulter personne de plus compétent que toi ?","s":["Dire « je ne sais pas », demander conseil, apprendre de subordonnés et d’étrangers","Erreurs corrigées avant catastrophe, compétences nouvelles","Certitudes remises à l’échelle, jugement affûté","Élévation durable : « il sera élevé »","1 à 5 ans"],"n":["Décider seul, certain d’être le plus compétent de la salle","Erreurs non corrigées, faute de contre-pouvoir","Angle mort grandissant, entourage réduit aux flatteurs","Chute publique : « l’orgueil précède la ruine » (Proverbes 16:18)","6 mois à 3 ans"],"i":"« Si je ne me vante pas, personne ne me remarquera. » Proverbes 27:2 répond : « Qu’un autre te loue, et non ta bouche ». La louange externe a une portée ; l’auto-promotion a une odeur — et tout le monde la sent."},"4.3":{"q":"La semaine dernière : combien de problèmes as-tu retirés des autres — et combien as-tu créés à autrui ?","s":["Prendre la tâche la plus ingrate de l’équipe, régler les problèmes d’autrui avant les siens","Crédit de confiance, équipe qui avance sans surveillance","Capital de légitimité qui croît en silence","Promotion par le service : « qu’il soit votre serviteur »","6 mois à 3 ans"],"n":["Attendre le titre pour donner, exiger sans montrer l’exemple","Cynisme de l’équipe, « on fait le minimum »","Autorité qui s’use à chaque ordre","Plafond de carrière : « on ne lui obéit plus »","1 à 3 ans"],"i":"« J’attends ma promotion pour servir pleinement. » L’ordre est inversé : la promotion suit le service, jamais l’inverse. Attendre le titre pour produire la valeur, c’est demander la moisson avant la semence."},"4.4":{"q":"Pourrais-tu écrire en une page ta destination à cinq ans ?","s":["Écrire la vision et les jalons, et les relire chaque semaine","Décisions plus rapides, refus plus faciles","Énergie concentrée, moins de dispersion","Accomplissement au temps fixé, équipe alignée","1 à 12 mois"],"n":["Garder la vision floue, dans la tête","Projets multiples, rien de terminé","Priorités qui changent au gré des occasions","Années dispersées, cap jamais atteint","1 à 10 ans"],"i":"« J’ai la vision dans le cœur, pas besoin de l’écrire. » Habaquq reçoit l’ordre d’écrire précisément parce que la mémoire déforme et que le découragement réécrit. Ce qui n’est pas gravé se négocie ; ce qui est gravé se poursuit."},"4.5":{"q":"Y a-t-il un chiffre, une promesse ou un récit que tu arranges légèrement ?","s":["Une seule version des faits, en public comme en privé","Moins de mensonges à entretenir, sommeil tranquille","Réputation de fiabilité qui s’accumule","Confiance durable, direction assurée","6 mois à plusieurs années"],"n":["Petits arrangements, double discours, raccourcis tordus","Gains rapides, dossiers à cacher","Dette de cohérence, mémoire du mensonge à entretenir","Découverte, perte de confiance, effondrement","1 à 10 ans"],"i":"« Tout le monde fait comme ça dans ce secteur. » La loi n’a pas de clause sectorielle. Le raccourci qui « marche » pour les autres produit le même résultat — il arrive juste à échéance différente."},"4.6":{"q":"Sur ta dernière décision importante, combien de personnes compétentes ont-elles pu te dire non avant que tu ne décides ?","s":["Constituer un cercle de trois à cinq conseillers et les consulter avant tout engagement majeur","Décisions amendées, angles morts fermés avant l’impact","Certitudes testées, ego rogné sans douleur","« Les projets réussissent » : réussite stable, réputation de sagesse","la durée de chaque projet"],"n":["Décider seul, ou ne consulter que des supporters","Erreurs répétées, projets abandonnés","Illusion de certitude, dépendance à l’écho","« Le peuple tombe » : l’effondrement est collectif, pas seulement personnel","6 mois à 2 ans"],"i":"« Dieu m’a parlé, je n’ai besoin de personne. » La révélation qui ne supporte pas la délibération n’est pas du Ciel — elle est du moi."},"4.7":{"q":"Quelle situation actuelle expliques-tu surtout par la faute de quelqu’un d’autre ?","s":["Dire « j’ai choisi, j’ai négligé, j’ai permis » sans transférer la faute","Excuses plus rapides, conversations plus courtes","Capacité d’action retrouvée, apprentissage de l’erreur","Autorité, confiance, trajectoire pilotée","immédiat à 6 mois"],"n":["Accuser les circonstances, les autres, la conjoncture","Soulagement bref","Perte de pouvoir sur la situation, erreurs répétées","Impuissance durable, relations tendues","6 mois à plusieurs années"],"i":"« C’est une attaque de l’ennemi. » Parfois. Mais la majorité des « attaques spirituelles » sont des conséquences mécaniques : budget non calculé (Loi 1.4), conflit non traité (Loi 3.3), corps non entretenu (Loi 2.2)."},"4.8":{"q":"Sur quelle personne absente as-tu porté un jugement définitif récemment ?","s":["Décrire le fait, interroger avant de conclure","Conversations plus calmes","Confiances qui se libèrent","Indulgence reçue quand on échoue à son tour","Quelques semaines à 1 an"],"n":["Étiqueter, condamner sur un acte isolé","Réponses défensives, tension","Cercle de défiance, polarisation","Condamnation sans grâce au premier faux pas","1 à 5 ans"],"i":"« Je ne juge pas, je dis les choses telles qu’elles sont. » Décrire un fait n’est pas juger ; deviner un cœur, si. La question à se poser : est-ce que j’accepterais qu’on me juge avec cette mesure ?"},"4.9":{"q":"À qui dois-tu un paiement ou une reconnaissance que tu retardes ?","s":["Payer le juste prix, au jour dit","Équipes motivées, prestataires fidèles","Réputation de sérieux qui circule","Prospérité partagée et durable","Quelques semaines à 1 an"],"n":["Retarder, rogner, profiter du travail d’autrui","Économie de trésorerie immédiate","Démotivation, départs, travail bâclé","Perte de confiance, ruine du service","6 mois à 3 ans"],"i":"« Je paierai quand ma trésorerie le permettra. » Le Deutéronome parle du salaire « le jour même ». La trésorerie du payeur n’est pas le problème de celui qui a travaillé : c’est une dette, non une option."},"5.1":{"q":"Quelles phrases sur toi-même, ta famille et ton avenir as-tu répétées plus de dix fois ce mois-ci ?","s":["Déclarer selon la promesse, nommer la solution au lieu du problème, bénir au lieu de maudire","Ambiance changée, auditeurs encouragés","Croyances reconfigurées, attention réglée sur l’ouverture","« Quiconque l’aime en mangera les fruits » : la vie répond aux phrases dominantes","1 à 5 ans"],"n":["Plaintes, déclarations de défaite, étiquettes posées sur autrui","Découragement collectif, occasions manquées","Croyance de l’échec gravée, cécité aux portes","« Tu es enlacé par les paroles de ta bouche » (Proverbes 6:2)","6 mois à 2 ans"],"i":"« Ce ne sont que des mots, je ne le pense pas vraiment. » Le cerveau ne distingue pas bien le sarcasme de la foi — il enregistre la fréquence. La plainte « pour rire » reste une semence : le cerveau enregistre la répétition, pas l’intention."},"5.2":{"q":"Combien de confiances reçues ces trois derniers mois n’ont dépassé aucune de tes conversations ?","s":["Se taire sur les projets non mûrs, les confidences reçues, les répliques chaudes","Réputations intactes, projets protégés jusqu’à maturité","Réserve d’énergie mentale, crédit de fiabilité","« Qui garde sa bouche garde son âme » : la confiance des décideurs","3 à 12 mois"],"n":["Tout dire, tout commenter, tout publier","Portes fermées, secrets trahis, promesses détruites","Indexation de soi comme « indiscret » dans tous les réseaux","Exclusion des cercles où se prennent les vraies décisions","1 à 6 mois"],"i":"« Je dois tout dire, sinon je ne suis pas authentique. » La transparence totale n’est pas une vertu biblique : « l’insensé déverse tout son esprit » (Proverbes 29:11). La sagesse est une curatelle, pas une évacuation."},"5.3":{"q":"Quel livre — hors réseaux sociaux — as-tu terminé récemment, et qu’as-tu changé dans ta vie grâce à lui ?","s":["Lire chaque jour dans les deux livres — la Parole et les bons livres — et écarter les flux qui remplacent la pensée","Vocabulaire élargi, jugements plus fins","Croyances démodées remplacées, attention profonde restaurée","« La sagesse repose dans le cœur de l’homme intelligent » : les décisions s’améliorent d’abord, puis la vie","3 à 18 mois"],"n":["Laisser l’algorithme décider de ce qu’on pense, huit heures par jour","Opinions préfabriquées, irritabilité face aux contradictions","Atrophie de l’attention profonde, pensée en slogans","Un cerveau formaté par des intérêts qui ne sont pas les tiens","3 à 12 mois"],"i":"« Je suis né de nouveau, ma pensée est automatiquement renouvelée. » Romains 12:2 s’adresse à des croyants : la nouvelle naissance change l’esprit, pas encore le raisonnement."},"5.4":{"q":"Combien d’heures par jour passent sur des contenus que tu n’as pas choisis ?","s":["Décider ce que je regarde et pour combien de temps","Moins de dispersion, plus de profondeur","Esprit moins saturé, décisions plus nettes","Clarté durable, projets menés à terme","2 à 8 semaines"],"n":["Laisser les flux capter l’attention sans limite","Heures perdues, fatigue mentale","Pensées dictées par les algorithmes, anxiété de fond","Trajectoire détournée, vie réactive","6 mois à plusieurs années"],"i":"« Je regarde, mais ça ne m’affecte pas. » Matthieu 6 dit le contraire : l’œil est une lampe — il n’y a pas de vision neutre. Chaque heure de ce que tu reçois éclaire ou obscurcit toute ta vie ; le « je gère » est l’excuse de celui qui a déjà cédé le contrôle."},"5.5":{"q":"Combien de oui en suspens pèsent sur ta semaine — messages non retournés, dettes, livrables ?","s":["Promettre moins, tenir tout : date, montant, livrable précis","Réputation d’exactitude, moins de relances","Cerveau libéré de la gestion des oublis","La confiance devient un actif qui travaille seul","1 à 3 ans"],"n":["Dire oui pour plaire, puis reporter, puis « oublier »","Réunions de rattrapage, excuses répétées","Cartographie mentale des dettes de parole","Évaporation du crédit : on ne te recommande plus pour rien d’important","6 mois à 2 ans"],"i":"« Je ferai de mon mieux » — la phrase refuge qui promet tout et n’engage rien. Dieu ne comptabilise ni les efforts ni les intentions : il enregistre les oui et les non. Mieux vaut un non fiable qu’un oui fluctuant."},"5.6":{"q":"Quelles phrases te dis-tu le plus souvent sur ton avenir et sur toi-même ?","s":["Déclarer ma direction et mes engagements avec des mots justes, avant la preuve","Ton plus assuré, hésitations réduites","Attention orientée vers les solutions","Actions cohérentes avec la parole, confiance gagnée","2 à 8 semaines"],"n":["Répéter la peur, l’échec, la plainte","Confirmation de ses craintes","Attention fixée sur le risque, motivation en baisse","Scénario redouté nourri","1 à 6 mois"],"i":"« Je confesse la victoire, donc je n’ai rien d’autre à faire. » La confession alignée ne remplace jamais la semence : elle l’accompagne."},"5.7":{"q":"Quand as-tu remercié quelqu’un nommément, pour un fait précis, pour la dernière fois ?","s":["Noter chaque jour des faits précis de gratitude","Humeur plus stable, regard plus attentif","Moins de comparaison, plus d’optimisme","Relations nourries, abondance ressentie","1 à 4 semaines"],"n":["Se plaindre en continu, ne voir que le manque","Irritation, comparaison permanente","Sentiment de manque, relations tendues","Amertume, stérilité intérieure","Progressif, sur des mois"],"i":"« Je serai reconnaissant quand j’aurai ce qui me manque. » Jésus rend grâces avant le miracle : devant cinq pains, pas devant cinq mille. Reconnaissance et abondance vont dans cet ordre."},"6.1":{"q":"Qu’as-tu semé cette semaine : temps, argent, paroles, efforts ? Quelle espèce domine ?","s":["Semer chaque jour, en petites quantités, la bonne espèce (temps, argent, parole)","Peu de résultats visibles au début","Racines, habitudes et réputation qui se forment","Récolte abondante, de même espèce, multipliée","une saison, de quelques mois à plusieurs années"],"n":["Ne rien semer, ou semer plainte, négligence et raccourcis","Tranquillité apparente","Terrain qui se couvre de mauvaises herbes","Même espèce récoltée, multipliée","une saison également"],"i":"« Je prie pour une moisson exceptionnelle. » La prière ne produit pas de moisson : la semence en produit."},"6.2":{"q":"Quelle prière répétée depuis plus d’un an attend encore son premier pas concret ?","s":["Faire le pas concret que la Parole ordonne, avant de voir le résultat","Circonstances déplacées par l’action elle-même","Foi confirmée par l’expérience propre","Ce qu’on demandait arrive par le canal de ce qu’on a fait","semaines à années"],"n":["Croire fort et ne rien changer : prier le changement sans le semer","Aucun déplacement visible des circonstances","Doute croissant, fatigue spirituelle","La foi sans les œuvres est morte en elle-même (Jacques 2:17, 26)","1 à 3 ans"],"i":"« J’attends que la foi vienne avant d’agir. » Le mécanisme est inverse : l’acte de foi précède et produit la certitude. Abraham « partit sans savoir où il allait » — le mouvement d’abord, la carte ensuite."},"6.3":{"q":"Ta dernière grande prière portait-elle une Écriture précise, ou était-elle une plainte générale ?","s":["Demander selon la Parole, croire, remercier avant la réponse ; jeûner pour les décisions capitales","Paix décisionnelle, timing qui s’ouvre","Relation entretenue, sensibilité restaurée","Tout ce qu’on demande en croyant, on le reçoit : la demande alignée rencontre un Dieu qui l’attend","variable — mais la paix, immédiate"],"n":["Répéter les demandes sans chercher l’alignement, ni croire, ni remercier","Silence apparent, autonomie croissante","Épaississement spirituel : on cesse d’entendre","« Vous demandez mal » (Jacques 4:3)","6 mois à 2 ans"],"i":"« J’ai tellement prié, Dieu ne répond pas. » Vérifie : ta demande contredit-elle une loi ? (Prier pour la provision en refusant le travail = demande mal posée, 2 Thessaloniciens 3:10.) Le silence face à une demande mal posée n’est pas un refus : c’est un renvoi pour correction."},"6.4":{"q":"Quel enseignement as-tu reçu récemment sans le mettre en pratique ?","s":["Agir dans les 24 heures sur ce que j’ai compris","Peu de décalage entre savoir et faire","Conviction renforcée par l’expérience","Fondation solide, résistance à l’épreuve","immédiat à 3 mois"],"n":["Accumuler les enseignements sans passer à l’acte","Sentiment de progresser","Faux raisonnements, justifications sophistiquées","Effondrement à la première tempête","1 à 5 ans"],"i":"« Je suis encore en train d’étudier le sujet. » La sur-formation sans mise en pratique est la paresse préférée des gens intelligents."},"6.5":{"q":"Que mets-tu en premier dans ton agenda et dans ton budget, concrètement ?","s":["Placer le Royaume en premier dans l’agenda et le budget","Moins de dispersion, décisions plus simples","Inquiétude qui baisse, focus qui se concentre","Provision ajoutée par surcroît, impact durable","3 à 12 mois"],"n":["Chercher d’abord les provisions, servir deux maîtres","Agenda plein, priorités floues","Dilution des talents, engagements contradictoires","Médiocrité, inquiétude permanente","1 à 5 ans"],"i":"« Je remettrai le Royaume en priorité quand les finances seront réglées. » C’est inverser la clause : la provision est la conséquence, pas le préalable. Attendre « toutes ces choses » avant de commencer, c’est attendre la conséquence avant la cause."},"6.6":{"q":"Combien de projets abandonnés étaient à plus de la moitié du chemin ?","s":["Tenir la semence en terre après que l’émotion du départ est passée ; travailler sans feedback","Progrès microscopiques mais cumulatifs","Caractère consolidé, fiabilité éprouvée","« Nous moissonnerons au temps convenable, si nous ne nous relâchons pas » (Galates 6:9)","le cycle propre de chaque semence"],"n":["Déterrer la semence pour vérifier, changer de champ chaque saison","Résultats initiaux puis dispersion","Habitude de l’inachevé, méfiance en soi","La moisson d’autrui, vue de loin","immédiat à 1 an"],"i":"« Ça fait trois mois que je sème, ça ne marche pas. » Trois mois ne sont pas une saison de moisson — c’est le début de la germination. Le « ça ne marche pas » prématuré a tué plus de destinées que tous les échecs réels réunis."},"6.7":{"q":"Y a-t-il quelque chose que je protège au point que cela limite déjà ce que je peux devenir ?","s":["Offrande volontaire d’un bien, d’un droit ou d’un confort","Libération d’espace et d’énergie","Détachement intérieur et confiance accrue","Multiplication et élargissement de l’influence","3 mois à plusieurs années"],"n":["Protection systématique de tous les acquis","Stagnation et frustration progressive","Idolâtrie des dons reçus","Plafond invisible et perte de sens","1 à 5 ans"],"i":"« Je donnerai quand j’aurai plus. » C’est exactement le raisonnement qui empêche le plus. Abraham n’a pas offert un fils de rechange ; il a offert l’unique. Le sacrifice qui attend l’abondance n’arrive presque jamais."},"7.1":{"q":"Quand ai-je demandé à Dieu et à un sage avant une décision importante, pour la dernière fois ?","s":[],"n":[],"i":"« Dieu m’a dit de ne rien planifier. » Non : la sagesse prépare et confie. Jacques 4:13-15 ne condamne pas les projets, il condamne l’arrogance qui oublie « si le Seigneur le veut »."},"7.2":{"q":"Y a-t-il une faute que je repousse, que je justifie ou que je cache ?","s":[],"n":[],"i":"« Dieu sait déjà, pas besoin de le dire. » Il sait, mais c’est l’aveu qui change mon cœur : la loi ne vise pas l’information de Dieu, elle vise ma vérité."},"7.3":{"q":"Quelle part concrète de mon temps ou de mon argent va à quelqu’un qui ne peut pas me rendre ?","s":[],"n":[],"i":"« Ils n’ont qu’à travailler comme moi. » Le travail enrichit (1.1), mais beaucoup de pauvretés viennent de l’injustice, de la maladie ou des circonstances. La loi ne demande pas de juger : elle demande de secourir."},"7.4":{"q":"Quel montant ou quel objet me ferait dire : « maintenant, c’est assez » ? Si je l’ignore, la course n’a pas de ligne d’arrivée.","s":[],"n":[],"i":"« Le contentement, c’est de la paresse. » Non : il n’interdit pas de progresser, il interdit de dépendre du prochain palier pour être heureux."},"7.5":{"q":"À qui ai-je refusé mon temps, mon écoute ou mon pardon cette semaine ?","s":[],"n":[],"i":"« J’aime tout le monde en général. » L’amour abstrait coûte peu ; l’amour du prochain a un nom et une adresse."}};
const BV={"1.1":[["Proverbes 6:6","Va vers la fourmi, paresseux; Considère ses voies, et deviens sage."],["Proverbes 10:4","Celui qui agit d’une main lâche s’appauvrit, Mais la main des diligents enrichit."],["Colossiens 3:23","Tout ce que vous faites, faites-le de bon cœur, comme pour le Seigneur et non pour des hommes,"]],"1.2":[["Proverbes 11:24-25","Tel, qui donne libéralement, devient plus riche; Et tel, qui épargne à l’excès, ne fait que s’appauvrir. L’âme bienfaisante sera rassasiée, Et celui qui arrose sera lui-même arrosé."],["2 Corinthiens 9:6","Sachez-le, celui qui sème peu moissonnera peu, et celui qui sème abondamment moissonnera abondamment."]],"1.3":[["Proverbes 3:9-10","Honore l’Éternel avec tes biens, Et avec les prémices de tout ton revenu: Alors tes greniers seront remplis d’abondance, Et tes cuves regorgeront de moût."],["Malachie 3:10","Apportez à la maison du trésor toutes les dîmes, Afin qu’il y ait de la nourriture dans ma maison; Mettez-moi de la sorte à l’épreuve, Dit l’Éternel des armées. Et vous verrez si je n’ouvre pas pour vous les écluses des cieux, Si je ne répands pas sur vous la bénédiction en abondance."]],"1.4":[["Luc 14:28-30","Car, lequel de vous, s’il veut bâtir une tour, ne s’assied d’abord pour calculer la dépense et voir s’il a de quoi la terminer, de peur qu’après avoir posé les fondements, il ne puisse l’achever, et que tous ceux qui le verront ne se mettent à le railler, en disant: Cet homme a commencé à bâtir, et il n’a pu achever?"],["Proverbes 21:5","Les projets de l’homme diligent ne mènent qu’à l’abondance, Mais celui qui agit avec précipitation n’arrive qu’à la disette."]],"1.5":[["Luc 16:10","Celui qui est fidèle dans les moindres choses l’est aussi dans les grandes, et celui qui est injuste dans les moindres choses l’est aussi dans les grandes."],["Matthieu 25:21","Son maître lui dit: C’est bien, bon et fidèle serviteur; tu as été fidèle en peu de chose, je te confierai beaucoup; entre dans la joie de ton maître."]],"1.6":[["Proverbes 22:7","Le riche domine sur les pauvres, Et celui qui emprunte est l’esclave de celui qui prête."],["Romains 13:8","Ne devez rien à personne, si ce n’est de vous aimer les uns les autres; car celui qui aime les autres a accompli la loi."]],"2.1":[["Exode 20:8-10","Souviens-toi du jour du repos, pour le sanctifier. Tu travailleras six jours, et tu feras tout ton ouvrage. Mais le septième jour est le jour du repos de l’Éternel, ton Dieu: tu ne feras aucun ouvrage, ni toi, ni ton fils, ni ta fille, ni ton serviteur, ni ta servante, ni ton bétail, ni l’étranger qui est dans tes portes."],["Marc 2:27","Puis il leur dit: Le sabbat a été fait pour l’homme, et non l’homme pour le sabbat,"]],"2.2":[["1 Corinthiens 6:19-20","Ne savez-vous pas que votre corps est le temple du Saint-Esprit qui est en vous, que vous avez reçu de Dieu, et que vous ne vous appartenez point à vous-mêmes? Car vous avez été rachetés à un grand prix. Glorifiez donc Dieu dans votre corps et dans votre esprit, qui appartiennent à Dieu."],["1 Timothée 4:8","car l’exercice corporel est utile à peu de chose, tandis que la piété est utile à tout, ayant la promesse de la vie présente et de celle qui est à venir."]],"2.3":[["1 Corinthiens 6:12","Tout m’est permis, mais tout n’est pas utile; tout m’est permis, mais je ne me laisserai asservir par quoi que ce soit."],["Proverbes 23:20-21","Ne sois pas parmi les buveurs de vin, Parmi ceux qui font excès des viandes: Car l’ivrogne et celui qui se livre à des excès s’appauvrissent, Et l’assoupissement fait porter des haillons."]],"2.4":[["Psaumes 127:2","En vain vous levez-vous matin, vous couchez-vous tard, Et mangez-vous le pain de douleur; Il en donne autant à ses bien-aimés pendant leur sommeil."],["Proverbes 3:24","Si tu te couches, tu seras sans crainte; Et quand tu seras couché, ton sommeil sera doux."]],"2.5":[["Psaumes 104:19","Il a fait la lune pour marquer les temps; Le soleil sait quand il doit se coucher."],["Ecclésiaste 3:1","Il ême."],["Jacques 2:26","Comme le corps sans âme est mort, de même la foi sans les œuvres est morte."],["Hébreux 11:8","C’est par la foi qu’Abraham, lors de sa vocation, obéit et partit pour un lieu qu’il devait recevoir en héritage, et qu’il partit sans savoir où il allait."]],"6.3":[["Marc 11:24","C’est pourquoi je vous dis: Tout ce que vous demanderez en priant, croyez que vous l’avez reçu, et vous le verrez s’accomplir."],["Jacques 4:3","Vous demandez, et vous ne recevez pas, parce que vous demandez mal, dans le but de satisfaire vos passions."],["1 Jean 5:14","Nous avons auprès de lui cette assurance, que si nous demandons quelque chose selon sa volonté, il nous écoute."]],"6.4":[["Jacques 1:22","Mettez en pratique la parole, et ne vous bornez pas à l’écouter, en vous trompant vous-mêmes par de faux raisonnements."],["Matthieu 7:24-25","C’est pourquoi, quiconque entend ces paroles que je dis et les met en pratique, sera semblable à un homme prudent qui a bâti sa maison sur le roc. La pluie est tombée, les torrents sont venus, les vents ont soufflé et se sont jetés contre cette maison: elle n’est point tombée, parce qu’elle était fondée sur le roc."]],"6.5":[["Matthieu 6:33","Cherchez premièrement le royaume et la justice de Dieu; et toutes ces choses vous seront données par-dessus."],["Matthieu 6:24","Nul ne peut servir deux maîtres. Car, ou il haïra l’un, et aimera l’autre; ou il s’attachera à l’un, et méprisera l’autre. Vous ne pouvez servir Dieu et Mamon."]],"6.6":[["Galates 6:9","Ne nous lassons pas de faire le bien; car nous moissonnerons au temps convenable, si nous ne nous relâchons pas."],["Hébreux 10:36","Car vous avez besoin de persévérance, afin qu’après avoir accompli la volonté de Dieu, vous obteniez ce qui vous est promis."]],"6.7":[["Romains 12:1","Je vous exhorte donc, frères, par les compassions de Dieu, à offrir vos corps comme un sacrifice vivant, saint, agréable à Dieu, ce qui sera de votre part un culte raisonnable."],["Marc 8:34-35","Puis, nnes les plus fréquentées, réseaux sociaux inclus.", "Tu arrêtes de suivre les moqueurs et tu suis des bâtisseurs.", "Tu rejoins une communauté de qualité (club, groupe, mastermind)."], "g": "Garder des compagnies qui te tirent vers le bas par habitude."}, "3.2": {"n": "Pardon", "m": "Le Pardon libérateur : la rancune est un locataire qui ne paie jamais", "p": "Le ressentiment occupe ton esprit pour le compte de quelqu’un d’autre.", "w": ["Tu décides à voix haute de pardonner à une personne précise, sans attendre ses excuses.", "Tu écris une lettre de libération, sans forcément l’envoyer.", "Tu fais la liste des rancunes actives (ex-associé, parent, ancien employeur) et tu les soldes une à une."], "g": "Retenir. La Bible dit que ça bloque ton propre pardon et ta prière."}, "3.3": {"n": "Conflit : vite", "m": "Le Délai de traitement : un conflit est une plaie", "p": "Chaque jour sans soin, la plaie s’infecte en ressentiment.", "w": ["Tu traites tout désaccord avant le lendemain, par un appel ou en face à face.", "Tu commences par reconnaître le point de l’autre avant d’exposer le tien."], "g": "Régler un conflit en public (story, mail en copie) ou par un long SMS."}, "3.4": {"n": "Servir d’abord", "m": "L’Amour inconditionnel et le Service : l’influence vient du service", "p": "Une vraie grandeur vient de ta capacité à servir sans attendre de retour immédiat.", "w": ["Un service précis et gratuit à quelqu’un cette semaine.", "Tu commences par tes proches avant les inconnus.", "Tu fais du mentorat : transmettre une compétence à un débutant."], "g": "Se servir des autres. Ça crée de la méfiance et de l’isolement."}, "3.5": {"n": "Boomerang", "m": "La Récolte relationnelle : tu seras traité comme tu traites", "p": "La façon dont tu traites les autres revient vers toi.", "w": ["Trois compliments sincères par jour, avec un fait précis.", "Tu ne dis de l’absent que ce que tu dirais devant lui.", "Tu envoies un message de soutien à quelqu’un qui traverse une épreuve."], "g" s."}, "4.2": {"n": "Humilité", "m": "L’Humilité préalable : l’orgueil est une erreur de place", "p": "Tu te crois propriétaire d’un domaine dont tu n’es que locataire.", "w": ["Une critique demandée chaque semaine à quelqu’un de compétent.", "Tu écris 3 compétences que tu n’as pas et qui les possède autour de toi.", "Tu commences un apprentissage de débutant pour retrouver le goût d’être mauvais."], "g": "Prendre une décision sans consulter quelqu’un de plus compétent."}, "4.3": {"n": "Servir pour monter", "m": "Le Service ascendant et l’Exemple : l’ascenseur fonctionne à l’envers", "p": "Celui qui sert le plus est celui qui monte.", "w": ["Tu fais toi-même la tâche ingrate du jour, sans le dire.", "Tu demandes à ton équipe ou ta famille : « quel problème puis-je vous enlever ? »", "💰 Freelance ou salarié, tu livres 10 % au-delà du cahier des charges. Ce surplus prépare ta prochaine négociation."], "g": "Se servir au lieu de servir."}, "4.4": {"n": "Cap écrit", "m": "La Vision écrite : un rêve écrit devient un plan de vol", "p": "Sans cap écrit, l’énergie se disperse.", "w": ["Une page avec ta destination à 5 ans, 3 jalons et des indicateurs, relue chaque semaine.", "Tu places les 3 jalons dans ton agenda.", "Tu filtres chaque opportunité avec : « cela avance-t-il le cap ? »"], "g": "Ne pas pouvoir écrire sa destination à 5 ans en une page."}, "4.5": {"n": "Test du journal", "m": "L’Intégrité structurelle : marcher droit quand personne ne regarde", "p": "C’est la seule fondation qui ne demande jamais de réparation.", "w": ["Test du journal, tu ne fais rien que tu n’accepterais de voir publié.", "💰 Facturation, déclarations, chiffres et promesses commerciales, sans aucun arrangement. Le chiffre réel est le seul chiffre, même quand il coûte."], "g": "Arranger légèrement un chiffre ou un récit. La Bible dit que tout finit par être découvert."}, "4.6": {"n": "Cercle de conseil", "m": "Le Conseil multiple et le Mentorat : décider seul est risqué", "p": "Décider seul, c’est signer un contrat jamais relu.", "w": ["Tu poses une vraie question (pas une demande de validation) à quelqu’un d’expérimenté.", "💰 Un cercle de 3 à 5 personnes (finance, métier, caractère), consultées avant tout engagement majeur (achat, embauche, pivot).", "Un rendez-vous mensuel avec quelqu’un qui a déjà fait le chemin."], "g": "Confondre consulter et déléguer son choix. La décision reste la tienne."}, "4.7": {"n": "Ma part", "m": "La Responsabilité pleine : « ce n’est pas ma faute » te rend impuissant", "p": "On ne peut pas réparer ce qu’on ne possède pas.", "w": ["Tu identifies ta part dans une difficulté et tu l’écris en une phrase.", "Tu fais un post-mortem sans accusation après un échec : quelle était ma part, que change-je ?", "Tu remplaces « on m’a… » par « j’ai choisi / permis / négligé »."], "g": "Accuser les autres. Ça te laisse sans pouvoir sur ta trajectoire."}, "4.8": {"n": "Pas de verdict", "m": "Le Non-Jugement : la sévérité que tu appliques te revient", "p": "Le critère rigide que tu utilises pour les autres sera appliqué à toi.", "w": ["Tu décris les faits sans juger les intentions.", "Tu fais une pause de trois secondes avant de commenter.", "Tu vas écouter la version de quelqu’un que tu as jugé trop vite."], "g": "Condamner vite quelqu’un d’absent."}, "4.9": {"n": "Payer juste", "m": "L’Équité envers le savoir et les salaires : payer juste garantit la loyauté", "p": "Un juste paiement des compétences et des efforts rend le système durable.", "w": ["Tu règles tout de suite les factures dues aux prestataires.", "💰 Virements programmés à l’échéance, contrat écrit à l’avance (tarif, délai, livrable).", "Tu nommes ceux qui ont contribué à un projet."], "g": "Retarder les paiements et profiter du travail d’autrui. Ça cause démotivation, départs et ruine du service."}, "5.1": {"n": "Parole créatrice", "m": "La Parole créatrice : tes phrases construisent ta réalité", "p": "Ce que tu répètes finit par te façonner.", "w": ["Tu enregistres une journée de conversations et tu comptes les phrases négatives et positives.", "Tu écris 3 déclarations de direction (moi, maison, travail) et tu les lis chaque matin.", "Tu fais un jeûne de plainte : tout fait rapporté est suivi de « et voici ce que je fais »."], "g": "Prononcer des paroles négatives sur toi, ta famille ou ton avenir."}, "5.2": {"n": "Silence", "m": "Le Silence stratégique : chaque mot inutile dilue les autres", "p": "La parole est une ressource limitée.", "w": ["Tu écris la réponse cinglante et tu la laisses 24 h avant tout envoi.", "Tu relis tes messages 3 fois avant envoi.", "Tu n’annonces un projet qu’à sa livraison."], "g": "Parler beaucoup et trahir des confidences."}, "5.3": {"n": "Esprit renouvelé", "m": "Le Renouvellement de l’intelligence : ton esprit est un jardin", "p": "La conformité est la friche, le renouvellement est le labour.", "w": ["20 minutes de lecture exigeante, écran hors de vue.", "Tu choisis un livre du mois et tu notes une page d’application par chapitre.", "💰 Tu repères une pensée limitante (« l’argent est sale ») et tu la remplaces par la vérité correspondante, par écrit."], "g": "Se laisser guider par ce que le téléphone propose."}, "5.4": {"n": "Attention gardée", "m": "La Garde de l’attention : ce que tu regardes te gouverne", "p": "L’attention est la porte du cœur.", "w": ["Tu mesures ton temps d’écran aujourd’hui et tu coupes une source captive.", "💰 Un budget d’attention comme un budget financier (création, apprentissage, repos, flux).", "Téléphone hors de la chambre, notifications coupées, bureau face au travail."], "g": "Passer des heures sur des contenus que tu n’as pas choisis."}, "5.5": {"n": "Oui = signature", "m": "Le Oui fiable et la Vérité : ta parole est ta signature", "p": "Chaque engagement tenu la grave, chaque excuse l’efface.", "w": ["Tu fais aujourd’hui la chose promise il y a le plus longtemps.", "Un oui = une date dans l’agenda, tout de suite.", "Tu sous-promets et tu sur-livres. L’écart positif construit ta réputation."], "g": "Avoir une parole élastique. Ça liquide ton capital de confiance, phrase après phrase."}, "5.6": {"n": "Dire tout haut", "m": "La Confession alignée : ce que je dis tout haut me guide", "p": "Le cœur croit, la bouche confirme.", "w": ["Une phrase vraie qui engage ta direction, dite à voix haute chaque matin.", "Tu remplaces chaque phrase d’auto-sabotage par une version factuelle et tenable.", "💰 Tu confesses la promesse tout en appliquant les lois 1.1 à 1.6. La bouche et les mains sur la même ligne."], "g": "Confesser la peur et l’échec. Tu te synchronises avec le scénario redouté."}, "5.7": {"n": "Merci précis", "m": "La Gratitude : remercier change le regard", "p": "La gratitude oriente ta perception vers ce que tu as, et amplifie ta capacité à le faire fructifier.", "w": ["Chaque soir, 3 faits précis, pas une phrase vague.", "Tu dis merci à quelqu’un par son prénom, avec la raison.", "Quand le manque domine, tu listes d’abord ce que tu as."], "g": "Se plaindre et ne voir que le manque. Ça mène à l’amertume."}, "6.1": {"n": "Loi-Mère : semence & moisson", "m": "La Loi-Mère, Semence et Moisson : tout est semence", "p": "C’est la loi dont toutes les autres sont des applications : tu récoltes ce que tu sèmes, en plus grand, au bon moment.", "w": ["Tu notes ce que tu sèmes aujourd’hui (temps, paroles, argent).", "💰 Tu choisis une semence quotidienne (épargne, compétence, relation) et tu la tiens 30 jours, sans déterrer la graine pour vérifier.", "Tu fais un journal des semis : quelle espèce domine ?"], "g": "Attendre une moisson sans avoir semé."}, "6.2": {"n": "Foi + acte", "m": "La Foi agissante : une foi sans acte est morte", "p": "Croire la promesse ET bouger en conséquence.", "w": ["Tu fais aujourd’hui le plus petit acte possible dans la direction de ta prière.", "Tu prépares la pluie : ouvrir le compte, réserver la salle, former l’équipe.", "Tu tiens un journal des actes de foi."], "g": "Prier la même chose depuis plus d’un an sans faire le moindre premier pas."}, "6.3": {"n": "Prière précise", "m": "La Prière alignée et le Jeûne : la prière n’est pas un ticket de loterie", "p": "Une demande faite à un Père, avec des conditions qu’Il a posées Lui-même.", "w": ["Une demande précise, adossée à un verset, avec remerciement anticipé.", "Après chaque demande : « quel est mon pas de recherche ? » planifié le jour même.", "Un jeûne partiel (un repas, un écran) consacré à une décision en cours."], "g": "Demander pour tes convoitises, ou prier contre les principes."}, "6.4": {"n": "Faire aussitôt", "m": "L’Obéissance réflexe : entendre sans faire est inutile", "p": "C’est lire le manuel d’urgence pendant que la maison brûle.", "w": ["Règle du 1:1, chaque livre, sermon ou formation exige une action avant le suivant.", "Tu mets en pratique avant ce soir une conviction reçue le matin.", "Tu consommes moitié moins de contenu et tu pratiques deux fois plus."], "g": "Écouter beaucoup et appliquer peu. C’est la maison sur le sable."}, "6.5": {"n": "Priorité n°1", "m": "La Priorité absolue et la Consécration : le plus important en premier", "p": "Les autres choses s’ajoutent à la priorité, pas à la discipline.", "w": ["Tu verrouilles dans l’agenda un premier créneau hebdomadaire pour l’essentiel.", "💰 Tu compares ton agenda et ton compte bancaire à ta priorité déclarée, et tu corriges l’écart. La première part sort avant les dépenses (loi 1.3).", "Tu évalues chaque opportunité d’abord selon ta priorité, ensuite selon le salaire."], "g": "Chercher d’abord « toutes ces choses ». Ça mène à l’inquiétude permanente."}, "6.6": {"n": "Tenir bon", "m": "La Persévérance et l’Épreuve : c’est entre la semence et la moisson que beaucoup abandonnent", "p": "Souvent à quelques jours de la récolte.", "w": ["Tu reprends 10 minutes un projet abandonné depuis plus d’un an.", "Tu donnes une durée minimale de 12 à 24 mois à chaque projet avant de pivoter.", "Tu tiens une chaîne visible des jours tenus."], "g": "Se relâcher avant la saison. La graine abandonnée ne moissonne pas."}, "6.7": {"n": "Lâcher pour grandir", "m": "Le Sacrifice et l’Autel : ce que tu refuses de lâcher devient ton plafond", "p": "Renoncer volontairement à quelque chose pour une cause plus grande libère.", "w": ["Tu renonces à un petit confort pour le bien de quelqu’un.", "💰 Un don qui se sent vraiment, pas seulement le reste confortable.", "Tu donnes une plage de temps fixe chaque semaine à un service qui ne rapporte rien."], "g": "S’accrocher à l’acquis. Tu te crées un plafond invisible."}, "7.1": {"n": "Sagesse", "m": "La Sagesse et la crainte de l’Éternel : tu n’es pas l’unique auteur de ton chemin", "p": "La sagesse commence quand tu demandes conseil, puis que tu planifies en remettant l’issue.", "w": ["Tu écris une décision en attente et tu demandes la sagesse en une phrase.", "💰 24 h de réflexion avant tout engagement majeur (achat, contrat, démission).", "Tu as 3 conseillers joignables et un journal de décisions (date, raison, résultat)."], "g": "S’appuyer sur sa seule intelligence. Ça donne des chemins tortueux et des regrets tardifs."}, "7.2": {"n": "Aveu", "m": "La Repentance et l’aveu : ce que je cache me retient", "p": "Ce que j’avoue me libère.", "w": ["Tu nommes une faute précise, par écrit, sans excuse.", "Tu vas vers la personne lésée, tu demandes pardon et tu proposes de réparer.", "Tes excuses sont précises : « j’ai fait X, c’était mal, voici ce que je répare », sans « mais »."], "g": "Cacher ou justifier. La faute grandit."}, "7.3": {"n": "Pauvres & justice", "m": "Les Pauvres et la Justice : ce que tu fais au plus petit compte", "p": "Donner, défendre, payer juste, avec constance et sans publicité.", "w": ["Un geste concret (aide, repas, appel) pour une personne en difficulté.", "💰 Un virement mensuel à une association de confiance, en plus de la dîme.", "Justice au travail : payer à temps, au juste prix, refuser l’injustice même rentable."], "g": "Détourner le regard. Le cœur se durcit."}, "7.4": {"n": "Assez", "m": "Le Contentement : une richesse que l’argent ne peut pas acheter", "p": "Ce n’est pas l’argent qui pose problème, c’est l’amour de l’argent.", "w": ["Tu écris 3 choses reçues aujourd’hui dont tu te passerais difficilement.", "💰 Tu fixes par écrit ton « assez » (revenu, patrimoine, niveau de vie), tu attends 30 jours avant tout achat non vital et tu décides quelle part de chaque hausse de revenu va au don et à l’épargne.", "Tu te désabonnes des newsletters et des pubs ciblées."], "g": "Courir après toujours plus. Si tu ignores ton « assez », la course n’a pas de ligne d’arrivée."}, "7.5": {"n": "Amour en gestes", "m": "L’Amour du prochain : l’amour se compte en gestes", "p": "On reconnaît un disciple à son amour, pas à ses idées.", "w": ["Un acte d’attention précis envers quelqu’un qui ne s’y attend pas.", "Tu écoutes une personne difficile sans l’interrompre.", "Tu as une conversation entière téléphone posé."], "g": "Aimer en idées plutôt qu’en actes. Les relations deviennent froides."}, "1.1": {"n": "Diligence", "m": "La Diligence : l’argent vient du travail régulier", "p": "Pas de chance ni de raccourci : celui qui travaille de façon constante s’enrichit, celui qui traîne dépend des autres.", "w": ["Tu fais la tâche la plus dure dans les 90 premières minutes de ta journée.", "Tu mesures ce que tu livres, pas les heures passées."], "g": "Dire « je prie pour que ça s’ouvre » sans passer à l’action."}, "1.2": {"n": "Semence généreuse", "m": "La Semence généreuse : donner pour recevoir", "p": "Ce que tu gardes par peur reste petit. Ce que tu donnes avec sagesse circule et revient, souvent par des chemins imprévus.", "w": ["Tu fixes un pourcentage de ton revenu pour donner, par exemple 5 %. Sur 2 000 €, ça fait 100 € par mois, planifiés comme une ligne de budget et pas ce qui reste.", "Ça marche aussi avec ta valeur : aider, recommander, partager gratuitement."], "g": "Donner pour « forcer » un retour. La Bible insiste sur la joie, pas sur le calcul."}, "1.3": {"n": "Première Part", "m": "La Première Part : on se sert avant de dépenser", "p": "Le principe est de séparer une part (la dîme, 10 %) dès que l’argent rentre, avant le loyer, les courses et les loisirs.", "w": ["Sur 2 000 € de salaire, 200 € partent par virement automatique le jour de la paie, vers une enveloppe dédiée.", "Même logique pour les revenus variables : tu prélèves à chaque entrée, pas en fin d’année."], "g": "Donner « ce qu’il reste ». Il ne reste jamais rien."}, "1.4": {"n": "Calcul préalable", "m": "Le Calcul préalable : on chiffre avant de se lancer", "p": "On s’assoit, on compte, puis on construit. Se lancer sans chiffrer, ce n’est pas de la foi, c’est de l’improvisation.", "w": ["Chaque euro a une affectation avant le début du mois.", "Pour un projet de 5 000 €, tu prévois 20 % de marge, soit 6 000 €.", "Tu constitues un fonds d’urgence de 3 à 6 mois de dépenses. Si tu dépenses 1 500 € par mois, ça fait 4 500 à 9 000 €."], "g": "Appeler « foi » une décision que tu n’as jamais chiffrée."}, "1.5": {"n": "Talents & fidélité", "m": "Les Talents : l’argent qui dort se perd", "p": "Le serviteur qui enterre son argent par peur n’a rien perdu, mais il n’a rien fait. Le livre dit que cette immobilité est une faute.", "w": ["Tu mets en place un versement automatique mensuel, par exemple 200 €, sur des supports diversifiés. L’Ecclésiaste conseille de répartir « en sept ou huit parts ».", "Tu fais aussi fructifier tes compétences, par exemple 30 minutes de formation par jour.", "Tu traites aussi les petits détails (une facture oubliée, une petite fuite de dépense), car la fidélité dans le peu mène au plus."], "g": "Attendre le « bon moment ». Le temps compte plus que le timing."}, "1.6": {"n": "Dette", "m": "La Dette : l’emprunteur est sous la main du prêteur", "p": "Un crédit de consommation te fait payer aujourd’hui avec l’argent de demain. Les intérêts sont le prix de cette dépendance.", "w": ["Tu listes toutes tes dettes avec leur taux.", "Tu choisis une méthode : l’avalanche (taux le plus haut d’abord) ou la boule de neige (plus petit solde d’abord).", "Tu refuses le « 4× sans frais » et le découvert permanent.", "Distinction importante : une dette de consommation est une chaîne, alors qu’un effet de levier calculé et productif peut être un outil, à condition de passer d’abord par la loi 1.4."], "g": "Prier pour sortir de la dette tout en signant le crédit suivant."}};

  h+=`<div class="dl2" style="background:linear-gradient(135deg,${dc},${shade(dc,-.35)})"><span class="bg">${di}</span><div class="k2">${entretien()?"LOI DU JOUR · ENTRETIEN":"LOI DU JOUR · PRIORITÉ À TRAVAILLER"}</div><h3>${di} · ${dl[1]}</h3>${X[di].m?`<p class="mt">${X[di].m}</p>`:""}<p>${X[di].p}</p>${entretien()?`<p>Toutes tes lois sont bien installées : on entretient les plus basses.</p>`:""}<div class="a2"><b>Action du jour :</b> ${dl[2]}</div><button class="wb" data-k="${di}">${dd?"✓ Fait":"Je l’ai fait"}</button><button class="wb" data-i="${di}">Ouvrir la fiche</button><button class="wb" data-r="1">🎲 Autre loi</button></div>`;

  if(old&&touched){const wn=D.map((_,k)=>dIds(k).length),o=Math.round(old.reduce((a,b,k)=>a+b*wn[k],0)/L.length),df=g-o,nw=Math.max(1,Math.round((mon(T)-new Date(pk+"T12:00:00"))/6048e5));h+=`<p class="sub" style="text-align:center;margin:8px 0 0">Depuis ${nw} semaine${nw>1?"s":""} : ${o} % → ${g} % (${df>=0?"+":""}${df})</p>`}

  if(!ex.start)h+='<div class="c2"><div class="k">CYCLE DE 51 SEMAINES</div><b>Une loi approfondie par semaine</b><p class="sub" style="margin:4px 0 8px">Idéal pour avancer méthodiquement sans se disperser.</p><button class="ch" data-w="start">Démarrer cette semaine</button></div>';
